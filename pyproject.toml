[build-system]
requires = [
    "setuptools >= 77.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "tatc"
description = "Tradespace Analysis Toolkit for Constellations (TAT-C)"
authors = [
    {name = "Paul T. Grogan", email = "paul.grogan@asu.edu"}
]
readme = "README.md"
requires-python = ">=3.10, <3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "geopandas >= 1.0",
    "numba",
    "numpy",
    "pandas >= 2.0",
    "pydantic >= 2.6",
    "pyproj",
    "shapely >= 2.0.1",
    "skyfield >= 1.49",
    "sgp4",
    "spiceypy",
    "typing-extensions",
    "pyyaml",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://tatc.readthedocs.io"
Repository = "https://github.com/code-lab-org/tatc"
Documentation = "https://tatc.readthedocs.io"
Issues = "https://github.com/code-lab-org/tatc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py310"]

[tool.setuptools.package-data]
"tatc" = [
    "resources/*.bsp",
    "resources/*.yml",
    "resources/instruments/*.yml",
    "resources/validation/*.json",
]

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]
extension-pkg-allow-list = ["pydantic"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
filterwarnings = [
    # upstream bug: skyfield sets ndarray.dtype in place, deprecated since numpy 2.5
    # https://github.com/skyfielders/python-skyfield/blob/master/skyfield/searchlib.py
    "ignore:Setting the dtype on a NumPy array has been deprecated:DeprecationWarning:skyfield.searchlib",
]

[project.optional-dependencies]
dev = [
    "black[jupyter] >= 24.2",
    "coverage",
    "pylint",
    "pylint-pydantic",
    "pytest",
    "pytest-xdist"
]
docs = [
    "autodoc_pydantic >= 2",
    "docutils",
    "myst-nb",
    "sphinx >= 7",
    "sphinx-rtd-theme"
]
examples = [
    "ipykernel",
    "joblib",
    "matplotlib",
    "cartopy"
]
osse = [
    "tatc[examples]",
    "netcdf4",
    "pydap",
    "rioxarray",
    "scipy",
    "scikit-learn",
    "seaborn",
    "xarray"
]
preprocess = [
    "rasterio"
]
tradespace = [
    "joblib",
    "matplotlib",
    "optuna",
    "pymoo"
]
validation = [
    "tatc[examples,preprocess]",
    "awsgnssroutils",
    "earthaccess",
    "h5py",
    "hatanaka",
    "metpy",
    "netcdf4",
    "pyhdf",
    "requests",
    "scipy"
]

[tool.setuptools.dynamic]
version = {attr = "tatc.__version__"}