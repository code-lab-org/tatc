name: Run Python Unit Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Install project in editable mode
      run: |
        pip install -e ".[preprocess,tradespace]"

    - name: Run unit tests
      run: python -m unittest

  minimum-versions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml
          tests/minimum_versions.txt

    - name: Install project with the minimum versions of its dependencies
      run: |
        pip install --prefer-binary -c tests/minimum_versions.txt -e ".[preprocess]"

    - name: Check the minimum versions were installed
      run: python tests/check_minimum_versions.py

    - name: Run unit tests
      run: python -m unittest

  wheel-contents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Build wheel
      run: |
        pip install build
        python -m build --wheel

    - name: Check packaged resources
      run: python tests/check_wheel_contents.py dist/*.whl
