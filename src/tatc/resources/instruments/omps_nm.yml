id: omps_nm
name: OMPS Nadir Mapper
aliases: [Ozone Mapping and Profiler Suite Nadir Mapper, OMPS NM, OMPS total column]
instrument_class: pushbroom
selection: Ultraviolet imaging spectrometer that maps total column ozone each day, on the operational JPSS satellites, with open data products.
platforms: [noaa-21, noaa-20, suomi-npp]
data_products:
  - name: OMPS Nadir Mapper total column geolocation (OMPS-TC-GEO)
    provider: NOAA Open Data Dissemination
    url: https://registry.opendata.aws/noaa-jpss/
    access: open
default_configuration: swath_noaa_21
performance:
  reference_altitude: 824000
  ground_sample_distance: 50000
  ground_sample_distance_exponent: 1
  provenance:
    reference_altitude:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"824 km above the ground\" (https://www.eoportal.org/satellite-missions/suomi-npp)"
    ground_sample_distance:
      kind: nominal
      source: "WMO OSCAR/Space, OMPS-nadir: \"Mapper: 50 km on S-NPP but improved to 10km on NOAA-21.\" (https://space.oscar.wmo.int/instruments/view/omps_nadir); eoPortal's NOAA-20 page also gives 50 km"
    ground_sample_distance_exponent:
      kind: derived
      source: "A fixed angular resolution projects to a ground distance proportional to altitude"
resources:
  mass: 12.5
  provenance:
    mass:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"The OMPS nadir instrument has a mass of 12.5 kg\" (https://www.eoportal.org/satellite-missions/suomi-npp); the nadir mapper and profiler"
configurations:
  swath_noaa_21:
    performance:
      reference_altitude: 824000
      ground_sample_distance: 10000
      ground_sample_distance_exponent: 1
      provenance:
        reference_altitude:
          kind: nominal
          source: "WMO OSCAR/Space, NOAA-20: \"824 km\" (https://space.oscar.wmo.int/satellites/view/noaa_20)"
        ground_sample_distance:
          kind: nominal
          source: "WMO OSCAR/Space, OMPS-nadir: \"Mapper: 50 km on S-NPP but improved to 10km on NOAA-21.\" (https://space.oscar.wmo.int/instruments/view/omps_nadir)"
        ground_sample_distance_exponent:
          kind: derived
          source: "A fixed angular resolution projects to a ground distance proportional to altitude"
    grade: timing
    description: The swath imaged between the outermost samples of NOAA-21's Nadir Mapper, with a view tailored to the analysis time step.
    platforms: [noaa-21]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: OMPS Nadir Mapper
          field_of_regard: 110.66
          cross_track_field_of_view: 109.9998
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          yaw_angle: -0.184491
          roll_angle: 0.3252
          pitch_angle: 0.0544
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the view, rolled by its offset
          cross_track_field_of_view: &measured_noaa_21
            kind: measured
            source: validate_catalog_omps.py --fit, the outermost samples 55.3251 deg left and 54.6747 deg right of the geodetic nadir (inertial frame)
            platforms: [noaa-21]
            period: "2026-10-01"
          roll_angle: *measured_noaa_21
          yaw_angle: &converted_noaa_21
            kind: measured
            source: validate_catalog_omps.py --fit, the slope of the samples' along-track on their cross-track tangents and the along-track angle of the sample nearest nadir (a yaw of -0.1848 deg and pitch of 0.0544 deg of the body, inertial frame), converted to the instrument's yaw before its roll
            platforms: [noaa-21]
            period: "2026-10-01"
          pitch_angle: *converted_noaa_21
          is_rectangular:
            kind: derived
            source: Models an imaged swath as a rectangular view
    limitations:
      - The instrument's yaw and pitch were measured as a yaw of -0.1848 deg and a pitch of 0.0544 deg of the body, and converted to the instrument's own angles (a yaw of -0.184491 deg, before its roll, gives the same view within 0.0001 deg), so that the configuration shares the body's attitude of the platform's other instruments. They were measured with validate_catalog_omps.py --fit on 2026-10-01, from the slope of the samples' along-track on their cross-track tangents (the same within 0.001 deg at every latitude) and the along-track angle of the sample nearest nadir, in the inertial frame.
  swath_noaa_20:
    grade: timing
    description: The swath imaged between the outermost samples of NOAA-20's Nadir Mapper, with a view tailored to the analysis time step.
    platforms: [noaa-20]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: OMPS Nadir Mapper
          field_of_regard: 109.07
          cross_track_field_of_view: 108.6016
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          yaw_angle: -0.295144
          roll_angle: -0.2294
          pitch_angle: 0.1859
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the view, rolled by its offset
          cross_track_field_of_view: &measured_noaa_20
            kind: measured
            source: validate_catalog_omps.py --fit, the outermost samples 54.0714 deg left and 54.5302 deg right of the geodetic nadir (inertial frame)
            platforms: [noaa-20]
            period: "2026-10-01"
          roll_angle: *measured_noaa_20
          yaw_angle: &converted_noaa_20
            kind: measured
            source: validate_catalog_omps.py --fit, the slope of the samples' along-track on their cross-track tangents and the along-track angle of the sample nearest nadir (a yaw of -0.2944 deg and pitch of 0.1859 deg of the body, inertial frame), converted to the instrument's yaw before its roll
            platforms: [noaa-20]
            period: "2026-10-01"
          pitch_angle: *converted_noaa_20
          is_rectangular:
            kind: derived
            source: Models an imaged swath as a rectangular view
    limitations:
      - The instrument's yaw and pitch were measured as a yaw of -0.2944 deg and a pitch of 0.1859 deg of the body, and converted to the instrument's own angles (a yaw of -0.295144 deg, before its roll, gives the same view within 0.0001 deg), so that the configuration shares the body's attitude of the platform's other instruments. They were measured with validate_catalog_omps.py --fit on 2026-10-01, from the slope of the samples' along-track on their cross-track tangents (the same within 0.02 deg at every latitude) and the along-track angle of the sample nearest nadir, in the inertial frame.
  swath_suomi_npp:
    grade: timing
    description: The swath imaged between the outermost samples of Suomi NPP's Nadir Mapper, with a view tailored to the analysis time step.
    platforms: [suomi-npp]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: OMPS Nadir Mapper
          field_of_regard: 107.72
          cross_track_field_of_view: 107.3326
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          yaw_angle: -0.090851
          roll_angle: 0.1934
          pitch_angle: 0.0739
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the view, rolled by its offset
          cross_track_field_of_view: &measured_suomi_npp
            kind: measured
            source: validate_catalog_omps.py --fit, the outermost samples 53.8597 deg left and 53.4729 deg right of the geodetic nadir (inertial frame)
            platforms: [suomi-npp]
            period: "2026-10-01"
          roll_angle: *measured_suomi_npp
          yaw_angle: &converted_suomi_npp
            kind: measured
            source: validate_catalog_omps.py --fit, the slope of the samples' along-track on their cross-track tangents and the along-track angle of the sample nearest nadir (a yaw of -0.0911 deg and pitch of 0.0739 deg of the body, inertial frame), converted to the instrument's yaw before its roll
            platforms: [suomi-npp]
            period: "2026-10-01"
          pitch_angle: *converted_suomi_npp
          is_rectangular:
            kind: derived
            source: Models an imaged swath as a rectangular view
    limitations:
      - The instrument's yaw and pitch were measured as a yaw of -0.0911 deg and a pitch of 0.0739 deg of the body, and converted to the instrument's own angles (a yaw of -0.090851 deg, before its roll, gives the same view within 0.0001 deg), so that the configuration shares the body's attitude of the platform's other instruments. They were measured with validate_catalog_omps.py --fit on 2026-10-01, from the slope of the samples' along-track on their cross-track tangents (the same within 0.02 deg at every latitude on ascending passes) and the along-track angle of the sample nearest nadir, in the inertial frame.
      - On data held out on 2026-08-25, epochs were within 20.2 s (95th percentile) and swath widths within 5.5 km (median), as the samples bow aft as on NOAA-20 and NOAA-21, and 98.2% of observed passes were predicted. The passes not predicted lie at the swath's edges (54 deg from nadir, median), within the 40 km of the outermost samples in which a pass is observed but beyond their centers, between which the view lies; Suomi NPP's samples are wider (35 across the swath) than NOAA-20's and NOAA-21's.
      - Suomi NPP was retired on 2026-11-02, when NOAA stopped delivering its data.
limitations:
  - The samples do not lie on a line across track. They bow aft toward the swath's edges, from about 0 deg along track near nadir to about 8.5 deg (NOAA-21) and 7.8 deg (NOAA-20) at the edges, about 150 km behind a straight line, which a view cannot represent. On data held out on 2026-11-05, epochs were therefore within 19.9 s (NOAA-21) and 19.1 s (NOAA-20) at the 95th percentile (median -5.6 and -5.1 s), and the swath widths, between the outermost samples, within 7.1 and 5.9 km (median), whereas 99.3% or more of observed passes were predicted and the swath's intersection over union was 0.99 or more (0.98 or more with views tailored to the time step, before swept swaths were added; rescored on the same data). The bow was found on the fitting day, after the fit and before the holdout.
  - NOAA-20, NOAA-21, and Suomi NPP do not steer their yaw, so the configurations use the inertial frame.
  - The Nadir Mapper images the sunlit part of each orbit, whereas the view observes whenever a target is in view, unless a solar limit is added.
  - No configuration gives sample sizes. The samples are macropixels of detectors summed on board, of unequal angles across the swath (Seftor et al., 2014), which one angle per view does not give, and only samples at nadir are published (12 km by 10 km on NOAA-21, 50 km by 17 km on NOAA-20, and 50 km by 50 km on Suomi NPP, across by along track, in NOAA's NOAA-21 OMPS Validated maturity review).
  - Each platform has its own configuration, fitted to its own data; NOAA-20 images fewer, wider samples than NOAA-21, and Suomi NPP fewer and wider still.
  - The yaw and pitch of the swath_noaa_21, swath_noaa_20, and swath_suomi_npp configurations were given to the body's attitude when tested, and then to the instrument, which gives the same views within 3 cm on the ground, so that the platform's instruments share the body's attitude. The records were rescored on the same held-out data, with swath widths changed by up to 6 m, as they are now measured with the instrument's yaw, and epochs by less than 0.0001 s, and every other result unchanged.
