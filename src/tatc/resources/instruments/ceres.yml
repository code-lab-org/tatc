id: ceres
name: CERES
aliases: [Clouds and the Earth's Radiant Energy System]
instrument_class: cross_track
selection: Broadband radiometer that measures the Earth's radiation budget, flown since 1997 and heavily used in climate research, with open data products.
platforms: [noaa-20, suomi-npp]
data_products:
  - name: CERES NOAA-20 FM6 ES-8 (CER_ES8_NOAA20-FM6), Edition1
    provider: NASA Langley ASDC
    url: https://asdc.larc.nasa.gov/project/CERES
    access: registration
  - name: CERES Suomi NPP FM5 ES-8 (CER_ES8_NPP-FM5), Edition2
    provider: NASA Langley ASDC
    url: https://asdc.larc.nasa.gov/project/CERES
    access: registration
default_configuration: swath_noaa_20
resources:
  mass: 57
  power: 50
  data_rate: 10500
  provenance:
    mass:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"57 kg/scanner\" (https://www.eoportal.org/satellite-missions/suomi-npp)"
    power:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"50 W (average) per scanner\" (https://www.eoportal.org/satellite-missions/suomi-npp)"
    data_rate:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"10.5 kbit/scanner (average)\" (https://www.eoportal.org/satellite-missions/suomi-npp)"
configurations:
  swath_noaa_20:
    grade: coverage
    description: The swath of CERES's cross-track scan on NOAA-20, between the outermost footprint centers, with a view tailored to the analysis time step.
    platforms: [noaa-20]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: CERES
          field_of_regard: 119.9692
          cross_track_field_of_view: 119.9692
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &measured_extent
            kind: measured
            source: validate_catalog_ceres.py --fit before the script took the first sweep of each record alone, with both sweeps of each record as scans, between the outermost footprint centers projected to the ellipsoid (59.9884 deg left, 59.9808 deg right of the geodetic nadir, inertial frame, the median over both sweeps)
            platforms: [noaa-20]
            period: "2026-08-25"
          cross_track_field_of_view: *measured_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - TAT-C observes all footprints of a view at one instant, whereas CERES sweeps the Earth in about 1.9 s, twice in each 6.6 s record and in opposite directions, so a footprint is observed up to about 1 s before or after the middle of its sweep.
      - The product places footprints at the top of the atmosphere (30 km); they are compared on the ellipsoid, projected along the line of sight from the spacecraft.
      - On data held out on 2026-09-30, 99.6% of observed passes were predicted and 99.4% of predicted passes observed, with epochs within 0.29 s (95th percentile) and the swath's intersection over union 0.9995 (0.998 with views tailored to the time step, before swept swaths were added; rescored on the same data), but the swath width, which a field of regard gives on a spherical Earth, differed by 7.9 km (median) from that between the outermost footprints, beyond the gate's 5 km. The difference grows toward the horizon, which the swath's edges, 60 deg from nadir, approach.
      - The field of regard was fitted with both sweeps of each record, whose footprints are offset by about 0.075 deg across track toward the end of each sweep, and was not fitted again when the script took the first sweep alone. On the fitting day, the first sweep alone measures 60.0639 deg left and 59.9074 deg right of the geodetic nadir (a field of regard of 119.9713 deg, centered 0.0786 deg to the left), and the second sweep 59.9138 deg left and 60.0574 deg right (centered 0.0718 deg to the right). The view is centered on nadir, as the mean of both sweeps is (0.0047 deg to the left), so the first sweep, which the record tests, lies about 0.08 deg to the left of the view.
      - The validation script was changed twice before its recorded run, without changing the entry. A run on the fitting day took both sweeps of each record as scans, whose cells crossed, and was replaced by the first sweep alone; a first run on 2026-09-30 kept every fourth footprint of a sweep, too sparse at the swath's edges to find the passes there (55.99% of predicted passes found), and was replaced by every footprint.
  swath_suomi_npp:
    grade: coverage
    description: The swath of CERES's cross-track scan on Suomi NPP, between the outermost footprint centers, with a view tailored to the analysis time step.
    platforms: [suomi-npp]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: CERES
          field_of_regard: 120.23
          cross_track_field_of_view: 119.9645
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          yaw_angle: -0.2725
          roll_angle: 0.1317
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the view, rolled by its offset
          cross_track_field_of_view: &measured_suomi_npp
            kind: measured
            source: validate_catalog_ceres.py --fit, between the outermost footprint centers projected to the ellipsoid (60.1139 deg left, 59.8506 deg right of the geodetic nadir, inertial frame)
            platforms: [suomi-npp]
            period: "2026-07-25"
          roll_angle: *measured_suomi_npp
          yaw_angle:
            kind: measured
            source: validate_catalog_ceres.py --fit, the slope of the footprints' along-track on their cross-track tangents (inertial frame)
            platforms: [suomi-npp]
            period: "2026-07-25"
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The instrument's yaw of -0.2725 deg (first given to the body's attitude, then to the instrument, which gives the same view, so that the configuration shares the body's attitude of Suomi NPP's other instruments) is measured with validate_catalog_ceres.py --fit on 2026-07-25, from the slope of the footprints' along-track on their cross-track tangents (the same within 0.015 deg at every latitude, ascending and descending), in the inertial frame. The along-track angle at nadir, -0.0006 deg, is not modeled.
      - TAT-C observes all footprints of a view at one instant, whereas CERES sweeps the Earth in about 1.9 s, as on NOAA-20.
      - The product places footprints at the top of the atmosphere (30 km); they are compared on the ellipsoid, projected along the line of sight from the spacecraft.
      - On data held out on 2026-06-20, with an element set from a file of the history of Suomi NPP's element sets (NOAA's archive has none before 2026-08-19), 99.996% of observed passes were predicted and 99.8% of predicted passes observed, with epochs within 1.49 s (95th percentile), the swath width within 0.71 km (median), and the swath's intersection over union 0.9999. The yaw was given to the body's attitude when tested, and then to the instrument, which gives the same views; the record was rescored on the same held-out data, with the swath width, now measured with the instrument's yaw, 15 m wider than 0.70 km, and every other result unchanged.
      - The product ends on 2026-07-31, and Suomi NPP was retired on 2026-11-02.
limitations:
  - NOAA-20 and Suomi NPP do not steer their yaw, so the configurations use the inertial frame.
  - Only the cross-track mode is modeled. CERES instruments also scan in other modes (rotating azimuth plane or along track) on some days, and those on Terra and Aqua differ.
  - No configuration gives sample sizes, as no published footprint size was used.
