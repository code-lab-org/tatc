          is_rectangular: *rectangular
    limitations:
      - The views are a union, so analyze them with instrument_index=None. The default analyzes only the first view, at one edge of the swath.
      - Each view is straight, and a line is within about 2 s of its view's center, at the view's ends.
      - At long time steps, the views far from nadir, tailored to a long along-track field of view, reach beyond the curved edges of the swath. The swath's intersection over union was 0.998 at 10 s and 0.994 at 30 s, but 0.937 at 120 s, which fails the standard's limit of 0.95, so use time steps of 30 s or less.
      - TROPOMI's data products cover the sunlit part of each orbit, whereas these views observe whenever a target is in view, unless a solar limit is added.
      - The views were fitted to the pixels of the ultraviolet and visible bands, and do not represent the 5.5 km by 7 km pixels of the shortwave infrared bands.
