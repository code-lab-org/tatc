          pitch_angle: -1.4866
          is_rectangular: true
        provenance:
          field_of_regard: *regard
          cross_track_field_of_view: *fitted
          roll_angle: *fitted
          pitch_angle: *fitted
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: TROPOMI pixels 128 to 304
