id: tropomi
name: TROPOMI
aliases: [TROPOspheric Monitoring Instrument, Sentinel-5P]
instrument_class: pushbroom
selection: Pushbroom spectrometer with open, daily, global products of atmospheric composition.
platforms:
  - id: sentinel-5p
    name: Sentinel-5P
    norad_id: 42969
    status: extended
    as_of: 2026-11-05
data_products:
  - name: Sentinel-5P TROPOMI Aerosol Index (L2__AER_AI), near real time
    provider: Sentinel-5P Level 2 on the Registry of Open Data on AWS
    url: https://registry.opendata.aws/sentinel5p/
    access: open
default_configuration: swath
configurations:
  swath:
    grade: coverage
    description: The swath of the 5.5 km by 3.5 km pixels, as a union of views that follow the curve of its lines, each tailored to the analysis time step.
    platforms: [sentinel-5p]
    velocity_frame: earth_fixed
    grouping: union
    instruments:
      - type: pointed
        parameters:
          name: TROPOMI pixels 0 to 32
          field_of_regard: 120
          cross_track_field_of_view: 5.424
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          roll_angle: 51.4378
          pitch_angle: -4.1966
          is_rectangular: true
        provenance:
          field_of_regard: &regard
            kind: derived
            source: Wider than the swath, so that it does not clip the views
          cross_track_field_of_view: &fitted
            kind: measured
            source: validate_catalog_tropomi.py --fit, the median directions of the ends of pixels of 6,188 lines, from recorded satellite positions
            platform: sentinel-5p
            period: "2026-10-05"
          roll_angle: *fitted
          pitch_angle: *fitted
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view: &tailored
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          is_rectangular: &rectangular
            kind: derived
            source: Models part of a line of a pushbroom swath as a rectangular view
      - type: pointed
        parameters:
          name: TROPOMI pixels 32 to 48
          field_of_regard: 120
          cross_track_field_of_view: 4.1214
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          roll_angle: 46.695
          pitch_angle: -3.4414
          is_rectangular: true
        provenance:
          field_of_regard: *regard
          cross_track_field_of_view: *fitted
          roll_angle: *fitted
          pitch_angle: *fitted
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: TROPOMI pixels 48 to 80
          field_of_regard: 120
          cross_track_field_of_view: 8.1566
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          roll_angle: 40.5871
          pitch_angle: -2.6026
          is_rectangular: true
        provenance:
          field_of_regard: *regard
          cross_track_field_of_view: *fitted
          roll_angle: *fitted
          pitch_angle: *fitted
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: TROPOMI pixels 80 to 128
