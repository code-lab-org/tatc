id: atms
name: ATMS
aliases: [Advanced Technology Microwave Sounder]
instrument_class: cross_track
selection: Cross-track microwave sounder of the Joint Polar Satellite System, with open data products and wide use in numerical weather prediction.
platforms:
  - id: noaa-20
    name: NOAA-20
    norad_id: 43013
    status: operational
    as_of: 2026-10-02
  - id: noaa-21
    name: NOAA-21
    norad_id: 54234
    status: operational
    as_of: 2026-11-05
data_products:
  - name: ATMS SDR geolocation (GATMO)
    provider: NOAA Open Data Dissemination
    url: https://registry.opendata.aws/noaa-jpss/
    access: open
default_configuration: swath_noaa_20
configurations:
  swath_noaa_20:
    grade: timing
    description: NOAA-20's swath scanned between the outermost beam centers, with a view tailored to the analysis time step.
    platforms: [noaa-20]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: ATMS
          field_of_regard: 105.6392
          cross_track_field_of_view: 105.6392
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &measured_extent
            kind: measured
            source: ValidateImagerATMS, Test 2, between the outermost beams (printed to 4 decimals)
            platform: noaa-20
            period: "2026-10-02"
          cross_track_field_of_view: *measured_extent
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view:
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - TAT-C observes all pixels of a view at one instant, whereas ATMS sweeps its beams over about 1.7 s.
      - The view is centered on nadir. The outermost beams measure 52.84 deg to the left and 52.80 deg to the right.
  beams_noaa_20:
    grade: sample_size
    description: NOAA-20's 96 beam positions of a scan, in the three beam widths of ATMS's channels. Analyze one at a time with its instrument index.
    platforms: [noaa-20]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 1
    instruments:
      - type: pointed
        parameters: &beam_parameters
          name: ATMS channels 1-2
          field_of_regard: 106.752
          cross_track_field_of_view: 106.752
          along_track_field_of_view: 1.112
          cross_track_pixels: 96
          roll_angle: 0.04
          is_rectangular: true
          cross_track_oversampling: 0.786154
          along_track_oversampling: 0.786154
          scan_period: 2.6666666666666665
        provenance: &beam_provenance
          field_of_regard: &measured_spacing
            kind: measured
            source: ValidateImagerATMS, Test 2, a fitted spacing of 1.112 deg over 96 beams
            platform: noaa-20
            period: "2026-10-02"
          cross_track_field_of_view: *measured_spacing
          along_track_field_of_view: *measured_spacing
          cross_track_pixels:
            kind: nominal
            source: ATMS has 96 Earth views per scan
          roll_angle:
            kind: measured
            source: ValidateImagerATMS, Test 2, the fitted roll
            platform: noaa-20
            period: "2026-10-02"
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling: &oversampling
            kind: derived
            source: One minus the fitted spacing divided by the beam width, published by channel
          along_track_oversampling: *oversampling
          scan_period:
            kind: nominal
            source: ATMS scans every 8/3 s
      - type: pointed
        parameters:
          <<: *beam_parameters
          name: ATMS channels 3-16
          cross_track_oversampling: 0.494545
          along_track_oversampling: 0.494545
        provenance: *beam_provenance
      - type: pointed
        parameters:
          <<: *beam_parameters
          name: ATMS channels 17-22
          cross_track_oversampling: -0.010909
          along_track_oversampling: -0.010909
        provenance: *beam_provenance
    limitations:
      - Pixels are projected at the time of a view, so beams near the edges of a scan are displaced along track by up to about 5 km from where ATMS samples them.
  swath_noaa_21:
    grade: timing
    description: NOAA-21's swath scanned between the outermost beam centers, with a view tailored to the analysis time step.
    platforms: [noaa-21]
    velocity_frame: inertial
    attitude: &noaa_21_attitude
      yaw_angle: 0.9341
      pitch_angle: -0.1362
    instruments:
      - type: pointed
        parameters:
          name: ATMS
          field_of_regard: 105.4326
          cross_track_field_of_view: 105.4326
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &noaa_21_extent
            kind: measured
            source: validate_catalog_atms.py --fit, between the outermost beams (52.6252 deg left, 52.8073 deg right)
            platform: noaa-21
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_extent
          is_swept: {kind: derived, source: "Models the view as sweeping along track, so that its swaths are the strips its cross-track line sweeps, as observations of points do"}
          along_track_field_of_view:
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The yaw of 0.9341 deg and pitch of -0.1362 deg are measured with validate_catalog_atms.py --fit on 2026-11-05, from the slope of the scan line and the along-track angle at nadir, with the spacecraft placed at each beam's time (constant within 0.001 deg over the day). NOAA-20's scan line, measured the same way, is rotated by only 0.06 deg, so its configurations do not model a yaw.
      - TAT-C observes all pixels of a view at one instant, whereas ATMS sweeps its beams over about 1.7 s.
  beams_noaa_21:
    grade: sample_size
    description: NOAA-21's 96 beam positions of a scan, in the three beam widths of ATMS's channels. Analyze one at a time with its instrument index.
    platforms: [noaa-21]
    velocity_frame: inertial
    attitude: *noaa_21_attitude
    grouping: alternatives
    instrument_index: 1
    instruments:
      - type: pointed
        parameters: &noaa_21_beam_parameters
          name: ATMS channels 1-2
          field_of_regard: 106.54176
          cross_track_field_of_view: 106.54176
          along_track_field_of_view: 1.10981
          cross_track_pixels: 96
          roll_angle: -0.086
          is_rectangular: true
          cross_track_oversampling: 0.786575
          along_track_oversampling: 0.786575
          scan_period: 2.6666666666666665
        provenance: &noaa_21_beam_provenance
          field_of_regard: &noaa_21_spacing
            kind: measured
            source: validate_catalog_atms.py --fit, a fitted spacing of 1.10981 deg over 96 beams
            platform: noaa-21
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_spacing
          along_track_field_of_view: *noaa_21_spacing
          cross_track_pixels:
            kind: nominal
            source: ATMS has 96 Earth views per scan
          roll_angle:
            kind: measured
            source: validate_catalog_atms.py --fit, the fitted roll
            platform: noaa-21
            period: "2026-11-05"
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling: &noaa_21_oversampling
            kind: derived
            source: One minus the fitted spacing divided by the beam width, published by channel
          along_track_oversampling: *noaa_21_oversampling
          scan_period:
            kind: nominal
            source: ATMS scans every 8/3 s
      - type: pointed
        parameters:
          <<: *noaa_21_beam_parameters
          name: ATMS channels 3-16
          cross_track_oversampling: 0.495541
          along_track_oversampling: 0.495541
        provenance: *noaa_21_beam_provenance
      - type: pointed
        parameters:
          <<: *noaa_21_beam_parameters
          name: ATMS channels 17-22
          cross_track_oversampling: -0.008918
          along_track_oversampling: -0.008918
        provenance: *noaa_21_beam_provenance
    limitations:
      - The yaw of 0.9341 deg and pitch of -0.1362 deg are those of the swath_noaa_21 configuration.
      - Pixels are projected at the time of a view, so beams near the edges of a scan are displaced along track by up to about 5 km from where ATMS samples them.
limitations:
  - The swath_noaa_20 and beams_noaa_20 configurations are fitted on NOAA-20, and swath_noaa_21 and beams_noaa_21 on NOAA-21, whose scan line is rotated by about 0.93 deg. NOAA-20's configurations on NOAA-21 are a transfer that warns on use; on 2026-11-05, the swath's passes were all found, but its width differed by 13.9 km and epochs by up to 3.3 s (95th percentile), and pixels lay 10.5 km from the beams (median). No configuration was tested on Suomi NPP.
