id: atms
name: ATMS
aliases: [Advanced Technology Microwave Sounder]
instrument_class: cross_track
selection: Cross-track microwave sounder of the Joint Polar Satellite System, with open data products and wide use in numerical weather prediction.
platforms: [noaa-20, noaa-21, suomi-npp]
data_products:
  - name: ATMS SDR geolocation (GATMO)
    provider: NOAA Open Data Dissemination
    url: https://registry.opendata.aws/noaa-jpss/
    access: open
default_configuration: swath_noaa_20
performance:
  reference_altitude: 824000
  ground_sample_distance: 32000
  ground_sample_distance_exponent: 1
  provenance:
    reference_altitude:
      kind: nominal
      source: "WMO OSCAR/Space, NOAA-20: \"824 km\" (https://space.oscar.wmo.int/satellites/view/noaa_20)"
    ground_sample_distance:
      kind: nominal
      source: "WMO OSCAR/Space, ATMS: \"16 km s.s.p. for channels 165-183 GHz, 32 km for channels 50-90 GHz, 75 km for channels 23-32 GHz\" (https://space.oscar.wmo.int/instruments/view/atms); the temperature-sounding channels"
    ground_sample_distance_exponent:
      kind: derived
      source: "A fixed angular resolution projects to a ground distance proportional to altitude"
resources:
  mass: 75.4
  power: 93
  data_rate: 20000
  provenance:
    mass:
      kind: nominal
      source: "WMO OSCAR/Space, ATMS: \"75.4 kg\" (https://space.oscar.wmo.int/instruments/view/atms)"
    power:
      kind: nominal
      source: "WMO OSCAR/Space, ATMS: \"93 W\" (https://space.oscar.wmo.int/instruments/view/atms); eoPortal gives about 130 W orbital average"
    data_rate:
      kind: nominal
      source: "eoPortal, Suomi NPP: \"The ATMS science data rate is 20 kbit/s (average) and 28 kbit/s (max).\" (https://www.eoportal.org/satellite-missions/suomi-npp)"
configurations:
  swath_noaa_20:
    grade: timing
    description: NOAA-20's swath scanned between the outermost beam centers, with a view tailored to the analysis time step.
    platforms: [noaa-20]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: ATMS
          field_of_regard: 105.6392
          cross_track_field_of_view: 105.6392
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &measured_extent
            kind: measured
            source: ValidateImagerATMS, Test 2, between the outermost beams (printed to 4 decimals)
            platforms: [noaa-20]
            period: "2026-10-02"
          cross_track_field_of_view: *measured_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - TAT-C observes all pixels of a view at one instant, whereas ATMS sweeps its beams over about 1.7 s.
      - The view is centered on nadir. The outermost beams measure 52.84 deg to the left and 52.80 deg to the right.
  beams_noaa_20:
    grade: sample_size
    description: NOAA-20's 96 beam positions of a scan, in the three beam widths of ATMS's channels. Analyze one at a time with its instrument index.
    platforms: [noaa-20]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 1
    instruments:
      - type: pointed
        parameters: &beam_parameters
          name: ATMS channels 1-2
          field_of_regard: 106.752
          cross_track_field_of_view: 106.752
          along_track_field_of_view: 1.112
          cross_track_pixels: 96
          roll_angle: 0.04
          is_rectangular: true
          cross_track_oversampling: 0.786154
          along_track_oversampling: 0.786154
          scan_period: 2.6666666666666665
        provenance: &beam_provenance
          field_of_regard: &measured_spacing
            kind: measured
            source: ValidateImagerATMS, Test 2, a fitted spacing of 1.112 deg over 96 beams
            platforms: [noaa-20]
            period: "2026-10-02"
          cross_track_field_of_view: *measured_spacing
          along_track_field_of_view: *measured_spacing
          cross_track_pixels:
            kind: nominal
            source: ATMS has 96 Earth views per scan
          roll_angle:
            kind: measured
            source: ValidateImagerATMS, Test 2, the fitted roll
            platforms: [noaa-20]
            period: "2026-10-02"
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling: &oversampling
            kind: derived
            source: One minus the fitted spacing divided by the beam width, published by channel
          along_track_oversampling: *oversampling
          scan_period:
            kind: nominal
            source: ATMS scans every 8/3 s
      - type: pointed
        parameters:
          <<: *beam_parameters
          name: ATMS channels 3-16
          cross_track_oversampling: 0.494545
          along_track_oversampling: 0.494545
        provenance: *beam_provenance
      - type: pointed
        parameters:
          <<: *beam_parameters
          name: ATMS channels 17-22
          cross_track_oversampling: -0.010909
          along_track_oversampling: -0.010909
        provenance: *beam_provenance
    limitations:
      - Pixels are projected at the time of a view, so beams near the edges of a scan are displaced along track by up to about 5 km from where ATMS samples them.
  swath_noaa_21:
    grade: timing
    description: NOAA-21's swath scanned between the outermost beam centers, with a view tailored to the analysis time step.
    platforms: [noaa-21]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: ATMS
          field_of_regard: 105.4326
          cross_track_field_of_view: 105.4326
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          yaw_angle: 0.9341
          pitch_angle: -0.1362
          is_rectangular: true
        provenance:
          field_of_regard: &noaa_21_extent
            kind: measured
            source: validate_catalog_atms.py --fit, between the outermost beams (52.6252 deg left, 52.8073 deg right)
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_extent
          yaw_angle: &noaa_21_scan_line
            kind: measured
            source: validate_catalog_atms.py --fit, the slope of the scan line and the along-track angle at nadir, with the spacecraft placed at each beam's time
            platforms: [noaa-21]
            period: "2026-11-05"
          pitch_angle: *noaa_21_scan_line
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The instrument's yaw of 0.9341 deg and pitch of -0.1362 deg are measured with validate_catalog_atms.py --fit on 2026-11-05, from the slope of the scan line and the along-track angle at nadir, with the spacecraft placed at each beam's time (constant within 0.001 deg over the day). They were first given to the body's attitude, then to the instrument, which gives the same view, so that the configuration shares the body's attitude of NOAA-21's other instruments. NOAA-20's scan line, measured the same way, is rotated by only 0.06 deg, so its configurations do not model a yaw.
      - TAT-C observes all pixels of a view at one instant, whereas ATMS sweeps its beams over about 1.7 s.
  beams_noaa_21:
    grade: sample_size
    description: NOAA-21's 96 beam positions of a scan, in the three beam widths of ATMS's channels. Analyze one at a time with its instrument index.
    platforms: [noaa-21]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 1
    instruments:
      - type: pointed
        parameters: &noaa_21_beam_parameters
          name: ATMS channels 1-2
          field_of_regard: 106.54176
          cross_track_field_of_view: 106.54176
          along_track_field_of_view: 1.10981
          cross_track_pixels: 96
          yaw_angle: 0.934304
          roll_angle: -0.086
          pitch_angle: -0.1362
          is_rectangular: true
          cross_track_oversampling: 0.786575
          along_track_oversampling: 0.786575
          scan_period: 2.6666666666666665
        provenance: &noaa_21_beam_provenance
          field_of_regard: &noaa_21_spacing
            kind: measured
            source: validate_catalog_atms.py --fit, a fitted spacing of 1.10981 deg over 96 beams
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_spacing
          along_track_field_of_view: *noaa_21_spacing
          cross_track_pixels:
            kind: nominal
            source: ATMS has 96 Earth views per scan
          roll_angle:
            kind: measured
            source: validate_catalog_atms.py --fit, the fitted roll
            platforms: [noaa-21]
            period: "2026-11-05"
          yaw_angle:
            kind: measured
            source: validate_catalog_atms.py --fit, the slope of the scan line and the along-track angle at nadir (a yaw of 0.9341 deg and pitch of -0.1362 deg of the body), converted to the instrument's yaw before its roll
            platforms: [noaa-21]
            period: "2026-11-05"
          pitch_angle: *noaa_21_scan_line
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling: &noaa_21_oversampling
            kind: derived
            source: One minus the fitted spacing divided by the beam width, published by channel
          along_track_oversampling: *noaa_21_oversampling
          scan_period:
            kind: nominal
            source: ATMS scans every 8/3 s
      - type: pointed
        parameters:
          <<: *noaa_21_beam_parameters
          name: ATMS channels 3-16
          cross_track_oversampling: 0.495541
          along_track_oversampling: 0.495541
        provenance: *noaa_21_beam_provenance
      - type: pointed
        parameters:
          <<: *noaa_21_beam_parameters
          name: ATMS channels 17-22
          cross_track_oversampling: -0.008918
          along_track_oversampling: -0.008918
        provenance: *noaa_21_beam_provenance
    limitations:
      - The pitch of -0.1362 deg is that of the swath_noaa_21 configuration. Its yaw of 0.9341 deg, measured as the body's, is converted to the instrument's yaw before its roll, 0.934304 deg, which gives the same view within 0.0001 deg.
      - Pixels are projected at the time of a view, so beams near the edges of a scan are displaced along track by up to about 5 km from where ATMS samples them.
  swath_suomi_npp:
    grade: timing
    description: Suomi NPP's swath scanned between the outermost beam centers, with a view tailored to the analysis time step.
    platforms: [suomi-npp]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: ATMS
          field_of_regard: 105.5513
          cross_track_field_of_view: 105.5513
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &suomi_npp_extent
            kind: measured
            source: validate_catalog_atms.py --fit, between the outermost beams (52.7250 deg left, 52.8263 deg right)
            platforms: [suomi-npp]
            period: "2026-10-02"
          cross_track_field_of_view: *suomi_npp_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The view is centered on nadir. The scan line, measured with validate_catalog_atms.py --fit on 2026-10-02, is rotated by -0.004 deg and looks 0.045 deg ahead at nadir, which are not modeled.
      - TAT-C observes all pixels of a view at one instant, whereas ATMS sweeps its beams over about 1.7 s.
      - Suomi NPP's geolocation product leaves 4 to 11 consecutive scans without positions at 70 to 81 deg latitude in almost every half orbit. On data held out on 2026-08-25, these holes in the observed swath, where the view predicts coverage, lowered the swath's intersection over union to 0.979 and pass precision to 98.8%.
      - Suomi NPP was retired on 2026-11-02, when NOAA stopped delivering its data.
  beams_suomi_npp:
    grade: sample_size
    description: Suomi NPP's 96 beam positions of a scan, in the three beam widths of ATMS's channels. Analyze one at a time with its instrument index.
    platforms: [suomi-npp]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 1
    instruments:
      - type: pointed
        parameters: &suomi_npp_beam_parameters
          name: ATMS channels 1-2
          field_of_regard: 106.6656
          cross_track_field_of_view: 106.6656
          along_track_field_of_view: 1.1111
          cross_track_pixels: 96
          roll_angle: -0.052
          is_rectangular: true
          cross_track_oversampling: 0.786327
          along_track_oversampling: 0.786327
          scan_period: 2.6666666666666665
        provenance: &suomi_npp_beam_provenance
          field_of_regard: &suomi_npp_spacing
            kind: measured
            source: validate_catalog_atms.py --fit, a fitted spacing of 1.11110 deg over 96 beams
            platforms: [suomi-npp]
            period: "2026-10-02"
          cross_track_field_of_view: *suomi_npp_spacing
          along_track_field_of_view: *suomi_npp_spacing
          cross_track_pixels:
            kind: nominal
            source: ATMS has 96 Earth views per scan
          roll_angle:
            kind: measured
            source: validate_catalog_atms.py --fit, the fitted roll
            platforms: [suomi-npp]
            period: "2026-10-02"
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling: &suomi_npp_oversampling
            kind: derived
            source: One minus the fitted spacing divided by the beam width, published by channel
          along_track_oversampling: *suomi_npp_oversampling
          scan_period:
            kind: nominal
            source: ATMS scans every 8/3 s
      - type: pointed
        parameters:
          <<: *suomi_npp_beam_parameters
          name: ATMS channels 3-16
          cross_track_oversampling: 0.494955
          along_track_oversampling: 0.494955
        provenance: *suomi_npp_beam_provenance
      - type: pointed
        parameters:
          <<: *suomi_npp_beam_parameters
          name: ATMS channels 17-22
          cross_track_oversampling: -0.010091
          along_track_oversampling: -0.010091
        provenance: *suomi_npp_beam_provenance
    limitations:
      - Pixels are projected at the time of a view, so beams near the edges of a scan are displaced along track by up to about 5 km from where ATMS samples them.
      - Suomi NPP was retired on 2026-11-02, when NOAA stopped delivering its data.
limitations:
  - The swath_noaa_20 and beams_noaa_20 configurations are fitted on NOAA-20, swath_noaa_21 and beams_noaa_21 on NOAA-21, whose scan line is rotated by about 0.93 deg, and swath_suomi_npp and beams_suomi_npp on Suomi NPP. NOAA-20's configurations on NOAA-21 are a transfer that warns on use; on 2026-11-05, the swath's passes were all found, but its width differed by 13.9 km and epochs by up to 3.3 s (95th percentile), and pixels lay 10.5 km from the beams (median).
  - The yaw and pitch of the swath_noaa_21 and beams_noaa_21 configurations were given to the body's attitude when tested, and then to the instrument, which gives the same views within 3 cm on the ground, so that the platform's instruments share the body's attitude. The records were rescored on the same held-out data, with pixel positions changed by less than 0.0001 km, and every other result unchanged.
