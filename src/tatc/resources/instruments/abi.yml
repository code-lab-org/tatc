id: abi
name: ABI
aliases: [Advanced Baseline Imager]
instrument_class: geostationary
selection: Imager of the GOES-R series of operational geostationary weather satellites, with open data products.
platforms: [goes-19, goes-18]
data_products:
  - name: GOES-R ABI Level 2 products
    provider: NOAA Open Data Dissemination
    url: https://registry.opendata.aws/noaa-goes/
    access: open
default_configuration: full_disk
performance:
  reference_altitude: 35786000
  ground_sample_distance: 2000
  ground_sample_distance_exponent: 1
  signal_to_noise_ratio: 300
  signal_to_noise_exponent: 0
  provenance:
    reference_altitude:
      kind: derived
      source: "The altitude of the geostationary orbit, at whose sub-satellite point the resolution is stated"
    ground_sample_distance:
      kind: nominal
      source: "WMO OSCAR/Space, ABI: \"2.0 km\" (https://space.oscar.wmo.int/instruments/view/abi); at the sub-satellite point, of the 1.38 and 2.26 um and infrared channels"
    ground_sample_distance_exponent:
      kind: derived
      source: "A fixed angular resolution projects to a ground distance proportional to altitude"
    signal_to_noise_ratio:
      kind: nominal
      source: "WMO OSCAR/Space, ABI: \"300 @ 100 % albedo\" (https://space.oscar.wmo.int/instruments/view/abi); of the 0.47 um channel"
    signal_to_noise_exponent:
      kind: derived
      source: "A passive instrument with a fixed instantaneous field of view collects the same radiance from an extended scene at any range"
resources:
  mass: 338
  power: 450
  data_rate: 66000000
  provenance:
    mass:
      kind: nominal
      source: "WMO OSCAR/Space, ABI: \"338 kg\" (https://space.oscar.wmo.int/instruments/view/abi)"
    power:
      kind: nominal
      source: "WMO OSCAR/Space, ABI: \"450 W\" (https://space.oscar.wmo.int/instruments/view/abi)"
    data_rate:
      kind: nominal
      source: "WMO OSCAR/Space, ABI: \"66 Mbps\" (https://space.oscar.wmo.int/instruments/view/abi)"
configurations:
  full_disk:
    grade: coverage
    description: The Earth's disk, as imaged by a full-disk scan.
    platforms: [goes-19]
    velocity_frame: earth_fixed
    instruments:
      - type: instrument
        parameters:
          name: ABI
          field_of_regard: 17.4
        provenance:
          field_of_regard:
            kind: derived
            source: Spans the Earth's disk from geostationary altitude
    limitations:
      - A larger field of regard would pass the same test, which shows that the disk is observed rather than the value of the field of regard.
  sst_good_quality:
    grade: coverage
    description: Where the sea surface temperature product is of good quality (local zenith angle up to 67 degrees).
    platforms: [goes-19]
    velocity_frame: earth_fixed
    instruments:
      - type: instrument
        parameters:
          name: ABI SST
          field_of_regard: 15.992925974773678
        provenance:
          field_of_regard:
            kind: derived
            source: compute_field_of_regard(35786e3, 90 - 67), from the bound declared by the product
  lst_good_quality:
    grade: coverage
    description: Where the land surface temperature product is of good quality (local zenith angle up to 55 degrees).
    platforms: [goes-19]
    velocity_frame: earth_fixed
    instruments:
      - type: instrument
        parameters:
          name: ABI LST
          field_of_regard: 14.222342173124204
        provenance:
          field_of_regard:
            kind: derived
            source: compute_field_of_regard(35786e3, 90 - 55), from the bound declared by the product
  pixels:
    grade: sample_size
    description: The fixed grid of the infrared bands (2 km), 5424 pixels square of 56 urad in scan angles, whose sizes and spacing `compute_sample_sizes` gives (east-west along track, north-south across track). Analyze it on a geosynchronous orbit at the grid's longitude (-75.2 deg), to which the products are navigated.
    platforms: [goes-19]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: ABI
          field_of_regard: 20
          cross_track_field_of_view: 17.403249
          along_track_field_of_view: 17.403249
          cross_track_pixels: 5424
          along_track_pixels: 5424
          view_geometry: scan
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the Earth's disk
          cross_track_field_of_view: &grid
            kind: nominal
            source: "GOES-R Product Definition and Users' Guide, Vol. 3 (L1b), Rev 2.3, section 5.1.2.2: \"The ABI native spatial resolutions are 0.5, 1.0, and 2.0 km at nadir... angular separation between imagery data points, which are 14, 28, and 56 microradians\" (https://www.ospo.noaa.gov/Organization/Documents/PUG/GS%20Series%20416-R-PUG-L1B-0347%20Vol%203%20Rev%202.3.pdf); the 5,424 pixels of 56 urad"
          along_track_field_of_view: *grid
          cross_track_pixels: &size
            kind: nominal
            source: "GOES-R Product Definition and Users' Guide, Vol. 3, Table 5.1.2.6: 5424 pixels square at 2 km for the full disk"
          along_track_pixels: *size
          view_geometry:
            kind: derived
            source: "The fixed grid's north-south angle is a rotation about the x axis, and its east-west angle about the rotated y axis (GOES-R Product Definition and Users' Guide, Vol. 3, section 5.1.2.1), the angles of a scan view in the inertial frame"
          is_rectangular:
            kind: derived
            source: Models the fixed grid as a rectangular view
    limitations:
      - Only sizes at the sub-satellite point are published, which the grid's angle defines, so the sample size gate is not applied.
      - The products are navigated to the grid seen from the nominal position, whereas a satellite's element sets lie up to a few hundredths of a degree from it, which moves a view projected from the satellite's position by kilometers. The configuration's along-track and cross-track directions are east and north only in the inertial frame.
      - "The grid is that of the infrared bands. The visible and near-infrared bands' grids are two (28 urad) and four (14 urad) times as fine; the detectors' instantaneous fields of view differ from the grid's angle (GOES-R Series Data Book, Table 3-1)."
limitations:
  - The scan is not modeled. Every point is available at any time, without the 10 minute cadence of a full-disk scan or the mesoscale and CONUS sectors.
  - On GOES-18 (GOES-West, 137.2 deg W), recorded as a transfer (full-disk products of 2026-11-17 at 12:00 UTC, with a public element set), every imaged pixel was observed, with elevation angles within 0.0006 deg, and the product limits were within 0.37 deg (sea surface temperature) and 0.25 deg (land surface temperature). Using the configurations on GOES-18 warns, as for any platform on which they were not validated.
