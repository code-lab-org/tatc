        parameters:
          name: CrIS
          field_of_regard: 96.6908
          cross_track_field_of_view: 96.6908
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          pitch_angle: -0.122
          is_rectangular: true
        provenance:
          field_of_regard: &noaa_21_extent
            kind: measured
            source: validate_catalog_cris.py --fit, between the outermost centers of fields of regard (48.3827 deg left, 48.3081 deg right)
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_extent
          pitch_angle: &noaa_21_tilt
            kind: measured
            source: validate_catalog_cris.py --fit, the median tilt of the scan plane (the median over every 5th scan of each scan's median)
            platforms: [noaa-21]
            period: "2026-11-05"
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - TAT-C observes all pixels of a view at one instant, whereas CrIS samples its fields of regard over about 5.8 s of each 8 s scan, as in the swath_noaa_20 configuration.
      - The view is centered on nadir. The outermost centers of fields of regard measure 48.38 deg to the left and 48.31 deg to the right.
      - The swath is that of the centers of fields of regard, so it leaves out about 1.6 deg of scan angle at each edge, which the outer fields of view and their footprints cover.
  pixels_noaa_21:
    grade: sample_size
    description: The fields of view of NOAA-21's 30 fields of regard, each an array of three by three, as 90 pixels across track and 3 along track.
    platforms: [noaa-21]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: CrIS
          field_of_regard: 102
          cross_track_field_of_view: 100.0248
          along_track_field_of_view: 3.2838
          cross_track_pixels: 90
          along_track_pixels: 3
          roll_angle: 0.038149
          pitch_angle: -0.122
          is_rectangular: true
          cross_track_oversampling: -0.154088
          along_track_oversampling: -0.136656
          scan_period: 8
        provenance:
          field_of_regard:
            kind: derived
            source: Wider than the field of view, so that it does not clip the scan
          cross_track_field_of_view:
            kind: measured
            source: validate_catalog_cris.py --fit, 30 fields of regard at a fitted spacing of 3.33416 deg
            platforms: [noaa-21]
            period: "2026-11-05"
          along_track_field_of_view:
            kind: measured
            source: validate_catalog_cris.py --fit, three fields of view at a fitted pitch of 1.0946 deg
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_pixels:
            kind: nominal
            source: CrIS has 30 fields of regard per scan, each of three by three fields of view
          along_track_pixels:
            kind: nominal
            source: CrIS has three rows of fields of view in a field of regard
          roll_angle:
            kind: measured
            source: validate_catalog_cris.py --fit, the fitted roll
            platforms: [noaa-21]
            period: "2026-11-05"
          pitch_angle: *noaa_21_tilt
          is_rectangular:
            kind: derived
            source: Models a scan line as a rectangular view
          cross_track_oversampling:
            kind: derived
            source: One minus the pixel spacing (the field of view over 90 pixels) divided by the published field of view of 0.963 deg
          along_track_oversampling:
            kind: derived
            source: One minus the fitted pitch divided by the published field of view of 0.963 deg
          scan_period:
            kind: nominal
            source: CrIS scans every 8 s
    limitations:
      - The limitations of the pixels_noaa_20 configuration apply, as the fields of view are modeled alike.
  swath_suomi_npp:
    grade: timing
    description: Suomi NPP's swath scanned between the outermost centers of fields of regard, tilted forward as the scan plane is, with a view tailored to the analysis time step.
    platforms: [suomi-npp]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: CrIS
          field_of_regard: 96.7105
          cross_track_field_of_view: 96.7105
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          pitch_angle: 0.086
          is_rectangular: true
        provenance:
          field_of_regard: &suomi_npp_extent
            kind: measured
            source: validate_catalog_cris.py --fit, between the outermost centers of fields of regard (48.3324 deg left, 48.3781 deg right)
            platforms: [suomi-npp]
            period: "2025-10-02"
          cross_track_field_of_view: *suomi_npp_extent
          pitch_angle: &suomi_npp_tilt
            kind: measured
            source: validate_catalog_cris.py --fit, the median forward tilt of the scan plane (the median over every 5th scan of each scan's median)
            platforms: [suomi-npp]
            period: "2025-10-02"
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - TAT-C observes all pixels of a view at one instant, whereas CrIS samples its fields of regard over about 5.8 s of each 8 s scan, as in the swath_noaa_20 configuration.
      - The view is centered on nadir. The outermost centers of fields of regard measure 48.33 deg to the left and 48.38 deg to the right.
      - The swath is that of the centers of fields of regard, so it leaves out about 1.6 deg of scan angle at each edge, which the outer fields of view and their footprints cover.
      - Suomi NPP's CrIS ended operational use on 2025-12-23, and the satellite was retired on 2026-11-02.
  pixels_suomi_npp:
