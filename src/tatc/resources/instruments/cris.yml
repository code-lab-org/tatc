            platforms: [suomi-npp]
            period: "2025-10-02"
          along_track_field_of_view:
            kind: measured
            source: validate_catalog_cris.py --fit, three fields of view at a fitted pitch of 1.0956 deg
            platforms: [suomi-npp]
            period: "2025-10-02"
          cross_track_pixels:
