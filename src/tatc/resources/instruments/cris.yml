limitations:
  - The swath_noaa_20 and pixels_noaa_20 configurations are fitted on NOAA-20, whose scan plane tilts forward by 0.223 deg, swath_noaa_21 and pixels_noaa_21 on NOAA-21, whose scan plane tilts aft by 0.122 deg, and swath_suomi_npp and pixels_suomi_npp on Suomi NPP, whose scan plane tilts forward by 0.086 deg. NOAA-20's configurations on NOAA-21 are a transfer that warns on use; on 2026-11-05, 99.85% of passes were found, with epochs within 1.12 s (95th percentile) and pixels 12.3 km from the fields of view (median), whereas NOAA-21's own swath gave epochs within 0.43 s on data held out on 2026-10-02.
