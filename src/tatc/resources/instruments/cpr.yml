id: cpr
name: CPR
aliases: [EarthCARE CPR, Cloud Profiling Radar]
instrument_class: profiler
selection: 94 GHz Doppler cloud profiling radar of JAXA and NICT on EarthCARE, the first spaceborne Doppler cloud radar, with open profiles of reflectivity and vertical motion along a single beam at nadir, flying with ATLID, MSI, and BBR.
platforms: [earthcare]
data_products:
  - name: CPR_NOM_1B
    provider: ESA MAAP (processed by JAXA)
    url: https://earth.esa.int/eogateway/catalog/earthcare-l1-products
    access: registration
default_configuration: nadir
performance:
  reference_altitude: 393140
  ground_sample_distance: 750
  ground_sample_distance_exponent: 1
  signal_to_noise_exponent: 2
  provenance:
    reference_altitude:
      kind: nominal
      source: "eoPortal, EarthCARE: \"an altitude of 393.14 km\" (https://www.eoportal.org/satellite-missions/earthcare)"
    ground_sample_distance:
      kind: nominal
      source: "eoPortal, EarthCARE: \"Beam footprint size ~750 m (IFOV= 0.095\u00ba)\" (https://www.eoportal.org/satellite-missions/earthcare)"
    ground_sample_distance_exponent:
      kind: derived
      source: "A real-aperture radar's footprint is set by its beam width, so it grows in proportion to altitude"
    signal_to_noise_exponent:
      kind: derived
      source: "The return of a radar from a target that fills its beam (precipitation or cloud) falls as the square of range"
resources:
  mass: 240
  power: 300
  data_rate: 270000
  provenance:
    mass:
      kind: nominal
      source: "eoPortal, EarthCARE: \"mass of 240 kg\" (https://www.eoportal.org/satellite-missions/earthcare); OSCAR gives 230 kg"
    power:
      kind: nominal
      source: "eoPortal, EarthCARE: \"power consumption of 300 W\" (https://www.eoportal.org/satellite-missions/earthcare)"
    data_rate:
      kind: nominal
      source: "eoPortal, EarthCARE: \"data rate of 270 kbit/s\" (https://www.eoportal.org/satellite-missions/earthcare)"
configurations:
  nadir:
    grade: timing
    description: A narrow view at nadir, about 10 km wide, that contains the radar's footprint, with a view tailored to the analysis time step.
    platforms: [earthcare]
    velocity_frame: earth_fixed
    instruments:
      - type: pointed
        parameters:
          name: CPR
          field_of_regard: 1.432
          cross_track_field_of_view: 1.432
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &width
            kind: derived
            source: 2 atan(5 km / 400 km), a view about 10 km wide at the orbit's altitude, which contains the footprint (about 0.8 km wide) at nadir given the error of an element set near the day
          cross_track_field_of_view: *width
          is_rectangular:
            kind: derived
            source: Models the band along the ground track as a rectangular view
    limitations:
      - The view's width is not the footprint's; it is wide enough to contain the profiles' positions given the error of an element set near the day of the analysis.
      - On data held out on 2026-11-07 (41 days from the fit, with the element set whose epoch is nearest the day's middle, 15:03 UTC), every sampled profile was within the view at its time and epochs were within 0.48 s (95th percentile; +0.20 s median), but the profiles lay 0.72 km (median) across track from the predicted ground track, failing the track offset gate. The element set's inclination (97.0160 deg) differs by about 0.01 deg from those of the sets around it (97.006 to 97.008 deg), and its orbit lay up to 1.3 km across track from the recorded positions (95th percentile), against 0.3 km on the day of the fit.
      - The same held-out data tested afterward with the day's other element set (epoch 07:20 UTC), whose orbit lay within 0.7 km across track of the recorded positions (95th percentile), had every sampled profile in view, the profiles 0.33 km (median) from the predicted ground track, and epochs within 0.69 s (95th percentile), passing every gate. The record keeps the element set chosen by the rule (epoch nearest the day's middle), so this result is not counted toward the tier.
  footprints:
    grade: sample_size
    description: The footprint of the radar's beam at nadir, whose size and spacing along track `compute_sample_sizes` gives.
    platforms: [earthcare]
    velocity_frame: earth_fixed
    instruments:
      - type: pointed
        parameters:
          name: CPR
          field_of_regard: 1.432
          cross_track_field_of_view: 0.095
          along_track_field_of_view: 0.095
          is_rectangular: false
          scan_period: 0.069151
        provenance:
          field_of_regard: *width
          cross_track_field_of_view: &beamwidth
            kind: nominal
            source: "ESA, EarthCARE CPR: \"Beam width | 0.095 degree\" (https://earth.esa.int/eogateway/instruments/cpr); JAXA CPR L1b Product Definition Document, beamwidthAT and beamwidthCT of 0.095"
          along_track_field_of_view: *beamwidth
          is_rectangular:
            kind: derived
            source: Models a footprint as a circular view
          scan_period:
            kind: derived
            source: "The time to travel the integration length of 500 m (Wehr et al. (2023), section 5.2: \"Horizontally averaged data along track are produced with the minimum pixel size of 500 m\") at the ground speed of a circular orbit at 393 km (7.23 km/s)"
    limitations:
      - Published footprints differ by definition and altitude (about 650 m across and 1 km along track on eoPortal; about 750 m at a maximum altitude of 450 km in Wehr et al. (2023); 765 m by 840 m for the product in JAXA's product definition), so they are compared without the gate. The beam width gives about 650 m at 393 km.
limitations:
  - The product's profile positions lie at the geodetic nadir of the recorded spacecraft positions (within 0.007 deg, 5th to 95th percentiles, on 2026-09-27; validate_catalog_cpr.py --fit), so the track offset tests the element set as much as the view.
  - The view observes everywhere along the ground track, whereas products omit profiles by quality and mode.
