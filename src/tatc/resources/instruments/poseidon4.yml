id: poseidon4
name: Poseidon-4
aliases: [Sentinel-6 altimeter, Sentinel-6 Michael Freilich Poseidon-4]
instrument_class: altimeter
selection: Nadir radar altimeter of Sentinel-6 Michael Freilich, the reference mission for global mean sea level, which continues the TOPEX/Poseidon and Jason series, with open data products.
platforms: [sentinel-6a, sentinel-6b]
data_products:
  - name: Sentinel-6A Level 2 low-resolution near-real-time reduced product (JASON_CS_S6A_L2_ALT_LR_RED_OST_NRT_F)
    provider: NASA PO.DAAC
    url: https://podaac.jpl.nasa.gov/dataset/JASON_CS_S6A_L2_ALT_LR_RED_OST_NRT_F
    access: registration
default_configuration: nadir
performance:
  reference_altitude: 1336000
  ground_sample_distance: 20000
  ground_sample_distance_exponent: 0.5
  signal_to_noise_exponent: 3
  provenance:
    reference_altitude:
      kind: nominal
      source: "WMO OSCAR/Space, Sentinel-6A: \"1336 km\" (https://space.oscar.wmo.int/satellites/view/sentinel_6a)"
    ground_sample_distance:
      kind: nominal
      source: "WMO OSCAR/Space, Poseidon-4: \"20 km IFOV.\" (https://space.oscar.wmo.int/instruments/view/poseidon_4); the footprint in low-resolution mode"
    ground_sample_distance_exponent:
      kind: derived
      source: "A pulse-limited altimeter's footprint has a diameter of 2 (c tau h)^(1/2), so it grows as the square root of altitude"
    signal_to_noise_exponent:
      kind: derived
      source: "The return of a pulse-limited altimeter from the sea surface falls as the cube of altitude"
resources:
  mass: 60
  power: 90
  data_rate: 12000000
  provenance:
    mass:
      kind: nominal
      source: "WMO OSCAR/Space, Poseidon-4: \"60 kg\" (https://space.oscar.wmo.int/instruments/view/poseidon_4)"
    power:
      kind: nominal
      source: "WMO OSCAR/Space, Poseidon-4: \"90 W\" (https://space.oscar.wmo.int/instruments/view/poseidon_4)"
    data_rate:
      kind: nominal
      source: "WMO OSCAR/Space, Poseidon-4: \"100 kbps, 12 Mbps (SAR)\" (https://space.oscar.wmo.int/instruments/view/poseidon_4); in SAR mode"
configurations:
  nadir:
    grade: timing
    description: A narrow view at nadir, about 10 km wide, that contains the altimeter's footprint, with a view tailored to the analysis time step.
    platforms: [sentinel-6a]
    velocity_frame: earth_fixed
    instruments:
      - type: pointed
        parameters:
          name: Poseidon-4
          field_of_regard: 0.43
          cross_track_field_of_view: 0.43
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &footprint
            kind: derived
            source: 2 atan(5 km / 1336 km), a view about 10 km wide at the orbit's altitude, which contains the pulse-limited footprint (a few kilometers wide) at nadir
          cross_track_field_of_view: *footprint
          is_rectangular:
            kind: derived
            source: Models the band along the ground track as a rectangular view
    limitations:
      - The view's width is not the footprint's, which depends on the sea state; it is wide enough to contain the measurements' positions, which lie at nadir.
limitations:
  - The measurements' positions are the satellite's nadir, so the track offset tests the element set as much as the view.
  - The view observes everywhere along the ground track, whereas products omit measurements by surface and quality.
  - On Sentinel-6B, recorded as a transfer (JASON_CS_S6B_L2_ALT_LR_RED_OST_NRT_G, 2026-11-08, with a public element set), every sampled measurement was within the view at its time, with the track within 0.107 km (median) and epochs within 0.11 s (95th percentile). Using the configuration on Sentinel-6B warns, as for any platform on which it was not validated.
  - No configuration gives sample sizes. The footprint of a pulse-limited altimeter depends on the sea state (from about 2 km on a calm sea to about 15 km, Donlon et al., 2021) rather than on a beam width (1.34 deg, whose footprint is about 31 km at 1,336 km), and no footprint of Poseidon-4 is published with its definition.
