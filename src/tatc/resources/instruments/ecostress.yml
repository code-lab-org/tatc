id: ecostress
name: ECOSTRESS
aliases: [ECOsystem Spaceborne Thermal Radiometer Experiment on Space Station, PHyTIR]
instrument_class: cross_track
selection: Thermal infrared radiometer on the International Space Station, whose orbit samples each place at varying times of day, used for evapotranspiration and water stress, with open data products.
platforms:
  - id: iss
    name: International Space Station
    norad_id: 25544
    status: operational
    as_of: 2026-11-09
data_products:
  - name: ECOSTRESS Level 1B geolocation (ECO_L1B_GEO) and attitude and ephemeris (ECO_L1B_ATT), version 002
    provider: NASA LP DAAC
    url: https://lpdaac.usgs.gov/products/eco_l1b_geov002/
    access: registration
default_configuration: swath
configurations:
  swath:
    grade: timing
    description: The swath swept between the outermost samples, with a view tailored to the analysis time step.
    platforms: [iss]
    velocity_frame: inertial
    attitude:
      yaw_angle: 3.7876
      pitch_angle: -7.2599
    instruments:
      - type: pointed
        parameters:
          name: ECOSTRESS
          field_of_regard: 56
          cross_track_field_of_view: 53.2204
          along_track_field_of_view: {tailor: time_step}
          roll_angle: 0.5028
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the view, rolled and pitched
          cross_track_field_of_view: &measured_view
            kind: measured
            source: validate_catalog_ecostress.py --fit, the outermost samples 27.1130 deg left and 26.1074 deg right of the geodetic nadir (inertial frame)
            platform: iss
            period: "2026-10-04"
          roll_angle: *measured_view
          along_track_field_of_view:
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          is_rectangular:
            kind: derived
            source: Models a swept swath as a rectangular view
    limitations:
      - The yaw of 3.7876 deg and pitch of -7.2599 deg are measured with validate_catalog_ecostress.py --fit on 2026-10-04, from the slope of the samples' along-track on their cross-track tangents (from 3.71 to 3.90 deg at the 5th and 95th percentiles) and the along-track angle of the sample nearest nadir, with the station's position at each sweep's start time. The pitch places the swath about 53 km behind the station; it may include an offset of the sweeps' times.
      - Each sweep images 128 lines at once; the fit uses the middle line of every fourth sweep of every fourth scene.
      - On data held out on 2026-11-07, 99.42% of observed passes were predicted and 97.54% of predicted passes observed, with epochs within 0.84 s (95th percentile) and the swath width within 2.11 km (median), but the swath's intersection over union was 0.930 at a time step of 120 s, below the gate's 0.95 (0.965 at 10 s and 0.962 at 30 s). A long view tailored to the time step is yawed and pitched with the body, which skews its ends. The swath is compared over spans of up to 5.1 min between gaps in the scenes.
      - The validation script was changed after a first run on 2026-11-07, without changing the entry. That run read every fourth scene, whose spans without gaps (0.8 min at most) were too short to compare the swath, and found passes within 10 km of a sample, fewer than the spacing of the samples kept (precision 59.15%); it was replaced by blocks of eight consecutive scenes in every 32 and a radius of 20 km.
limitations:
  - The station flies in a fixed attitude relative to its orbit, without yaw steering, so the configuration uses the inertial frame. Its attitude changes for operations such as dockings, which are not modeled.
  - ECOSTRESS images scenes over land and coastal waters by plan, whereas the view observes whenever a target is in view.
  - The station's orbit decays and is reboosted often, so element sets age quickly.
  - No configuration gives sample sizes, as no published instantaneous field of view was used.
