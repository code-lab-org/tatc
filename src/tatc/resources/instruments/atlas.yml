id: atlas
name: ATLAS
aliases: [ICESat-2 ATLAS, Advanced Topographic Laser Altimeter System]
instrument_class: lidar
selection: Photon-counting laser altimeter of ICESat-2, with open products of ice, land, vegetation, and ocean heights along six narrow beams.
platforms: [icesat-2]
data_products:
  - name: ATL08QL
    provider: NASA NSIDC DAAC
    url: https://nsidc.org/data/atl08ql
    access: registration
default_configuration: beam_pairs
performance:
  reference_altitude: 496000
  ground_sample_distance: 10
  ground_sample_distance_exponent: 1
  signal_to_noise_exponent: 2
  provenance:
    reference_altitude:
      kind: nominal
      source: "eoPortal, ICESat-2: \"at an altitude of 496 km\" (https://www.eoportal.org/satellite-missions/icesat-2)"
    ground_sample_distance:
      kind: nominal
      source: "eoPortal, ICESat-2: \"10 m ground footprints\" (https://www.eoportal.org/satellite-missions/icesat-2)"
    ground_sample_distance_exponent:
      kind: derived
      source: "A lidar's footprint is set by the divergence of its beam, so it grows in proportion to altitude"
    signal_to_noise_exponent:
      kind: derived
      source: "The return of a lidar from a target that fills its footprint falls as the square of range"
resources:
  mass: 298
  power: 300
  provenance:
    mass:
      kind: nominal
      source: "eoPortal, ICESat-2: \"The ATLAS instrument has a mass of 298 kg and a power consumption of 300 W.\" (https://www.eoportal.org/satellite-missions/icesat-2)"
    power:
      kind: nominal
      source: "eoPortal, ICESat-2: \"The ATLAS instrument has a mass of 298 kg and a power consumption of 300 W.\" (https://www.eoportal.org/satellite-missions/icesat-2)"
configurations:
  beam_pairs:
    grade: timing
    description: The three pairs of beams, as narrow views that contain where each pair observes, given an element set a few days old. Analyze one pair at a time with its instrument index (0 on the left, 2 on the right).
    platforms: [icesat-2]
    velocity_frame: earth_fixed
    grouping: alternatives
    instruments:
      - type: pointed
        parameters:
          name: ATLAS beam pair 1
          roll_angle: 0.3507
          cross_track_field_of_view: 0.5824
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          roll_angle: &measured
            kind: measured
            source: validate_catalog_atlas.py --fit, the median and spread (99.5th percentile) of the pair's offsets from the ground track over Antarctica
            platforms: [icesat-2]
            period: "2026-10-01"
          cross_track_field_of_view: *measured
          is_rectangular: &rectangular
            kind: derived
            source: Models the band containing a pair's track as a rectangular view
      - type: pointed
        parameters:
          name: ATLAS beam pair 2
          roll_angle: -0.0511
          cross_track_field_of_view: 0.5870
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: ATLAS beam pair 3
          roll_angle: -0.4511
          cross_track_field_of_view: 0.5872
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          is_rectangular: *rectangular
    limitations:
      - Each view is about 4.9 km wide, whereas a beam's footprint is about 11 m wide. The width holds the error of an element set a few days old (about 2.5 days at the fit), so a view shows where a pair may observe, not the area it observes. Older element sets need wider views.
      - The views follow the ground track of the element set's orbit, where ICESat-2 points its beams along their reference tracks, as over Antarctica, where the configuration was fitted and tested. Elsewhere, ICESat-2 often points them off the reference tracks (8 to 15 km between 40 deg S and 60 deg N, in ValidateLidarICESat2), which these views do not represent.
      - Each pair's strong and weak beams, about 90 m apart across track and 2.5 km along track, share one view.
      - On held-out data (4 November 2026, with an element set of 8 November, about 4 days from the data), the views contained every sampled segment, but TAT-C's epochs preceded the segments' times by 5.5 s (median), failing the timing gate. This is consistent with an along-track error of the element set, such as after an orbit adjustment that it does not represent, as ValidateLidarICESat2 also found; epochs are only as accurate as the element set along track.
      - The same held-out data tested afterward with the element set of the day (epoch nearest its middle, from validation/catalog/elements/icesat2_2026-11-04.3le; validate_catalog_atlas.py --same-day-element-set) had every sampled segment within its pair's view, the pairs' spacing within 0.021 km, and epochs within 0.37 s (95th percentile; +0.03 s median), passing the timing gate. The record keeps the element set a few days from the data, the age for which the views' widths were fitted, so this result is not counted toward the tier.
  footprints:
    grade: sample_size
    description: The footprints of the three beam pairs' centers, at the angles of the beam pairs configuration, whose sizes and spacing along track `compute_sample_sizes` gives, from published values; not compared with reference data.
    platforms: [icesat-2]
    velocity_frame: earth_fixed
    grouping: alternatives
    instruments:
      - type: pointed
        parameters: &footprint_parameters
          name: ATLAS beam pair 1
          field_of_regard: 2
          cross_track_field_of_view: 0.001375
          along_track_field_of_view: 0.001375
          roll_angle: 0.3507
          is_rectangular: false
          scan_period: 0.0001
        provenance: &footprint_provenance
          field_of_regard:
            kind: derived
            source: Contains the footprint
          cross_track_field_of_view: &divergence
            kind: nominal
            source: "Martino et al. (2023), Proc. SPIE 12512, Table 1: \"Transmitted Beam divergence (85% enclosed energy) 24 µR\", typical values that vary from beam to beam and with temperature (https://ntrs.nasa.gov/api/citations/20230010087/downloads/Martino_12512-17v2.pdf)"
          along_track_field_of_view: *divergence
          roll_angle: *measured
          is_rectangular:
            kind: derived
            source: Models a footprint as a circular view
          scan_period:
            kind: nominal
            source: "Neumann et al. (2019), Remote Sensing of Environment 233, 111325, Table 1: a pulse repetition rate of 10 kHz, footprints \"spaced ~0.7 m along track\" (https://pmc.ncbi.nlm.nih.gov/articles/PMC6839705)"
      - type: pointed
        parameters:
          <<: *footprint_parameters
          name: ATLAS beam pair 2
          roll_angle: -0.0511
        provenance: *footprint_provenance
      - type: pointed
        parameters:
          <<: *footprint_parameters
          name: ATLAS beam pair 3
          roll_angle: -0.4511
        provenance: *footprint_provenance
    limitations:
      - The footprint is that of the typical divergence (about 12 m at 496 km, 85% enclosed energy), whereas footprints measured with retroreflectors average 10.9 m (Magruder et al., 2021); the strong and weak beams of a pair, about 90 m apart, share their pair's center. The reference data of the entry (ATL08 segments of 100 m) do not give the spacing of shots, so the configuration is nominal.
limitations:
  - TAT-C does not find ICESat-2's 91-day repeat cycle from an element set; declare it as a maintained orbit (see ValidateLidarICESat2).
