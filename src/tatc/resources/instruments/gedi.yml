id: gedi
name: GEDI
aliases: [Global Ecosystem Dynamics Investigation]
instrument_class: lidar
selection: Multibeam lidar on the International Space Station that measures forest structure and canopy height in eight tracks, with open data products.
platforms:
  - id: iss
    name: International Space Station
    norad_id: 25544
    status: operational
    as_of: 2026-11-09
data_products:
  - name: GEDI L1B Geolocated Waveform Data (GEDI01_B), version 003
    provider: NASA LP DAAC
    url: https://lpdaac.usgs.gov/products/gedi01_bv003/
    access: registration
default_configuration: beams
configurations:
  beams:
    grade: timing
    description: The eight beam tracks, as narrow views that contain where each beam observes while GEDI points within a degree of nadir, given an element set of the day. Analyze one beam at a time with its instrument index (0 on the left, 7 on the right).
    platforms: [iss]
    velocity_frame: inertial
    attitude:
      pitch_angle: -3.2916
    grouping: alternatives
    instruments:
      - type: pointed
        parameters:
          name: GEDI BEAM0000
          roll_angle: 0.4794
          cross_track_field_of_view: 2.0438
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: &measured
            kind: measured
            source: validate_catalog_gedi.py --fit, the median and spread (99.5th percentile) of the beam's offsets from the ground track of the element set nearest the middle of the day, where the beams' center lay within 1 deg of nadir
            platform: iss
            period: "2026-05-01"
          cross_track_field_of_view: *measured
          along_track_field_of_view: &tailored
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          is_rectangular: &rectangular
            kind: derived
            source: Models the band containing a beam's track as a rectangular view
      - type: pointed
        parameters:
          name: GEDI BEAM0001
          roll_angle: 0.3949
          cross_track_field_of_view: 2.0574
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM0010
          roll_angle: 0.3278
          cross_track_field_of_view: 2.0467
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM0011
          roll_angle: 0.2441
          cross_track_field_of_view: 2.062
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM0101
          roll_angle: 0.1364
          cross_track_field_of_view: 2.0643
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM0110
          roll_angle: 0.053
          cross_track_field_of_view: 2.0442
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM1000
          roll_angle: -0.0482
          cross_track_field_of_view: 2.0719
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
        provenance:
          roll_angle: *measured
          cross_track_field_of_view: *measured
          along_track_field_of_view: *tailored
          is_rectangular: *rectangular
      - type: pointed
        parameters:
          name: GEDI BEAM1011
          roll_angle: -0.1315
          cross_track_field_of_view: 2.0861
          along_track_field_of_view: {tailor: time_step}
          is_rectangular: true
