id: oci
name: OCI
aliases: [Ocean Color Instrument, PACE OCI]
instrument_class: cross_track
selection: Hyperspectral cross-track scanner of NASA's PACE mission (2024), for ocean color, aerosols, and clouds, whose telescope tilts fore or aft to avoid sun glint, with open data products.
platforms:
  - id: pace
    name: PACE
    norad_id: 58928
    status: operational
    as_of: 2026-11-04
data_products:
  - name: PACE OCI Level-1B Science Data (PACE_OCI_L1B_SCI), version 3
    provider: NASA OB.DAAC
    url: https://search.earthdata.nasa.gov/search?q=PACE_OCI_L1B_SCI
    access: registration
default_configuration: swath
configurations:
  swath:
    grade: timing
    description: The swath scanned between the outermost samples, tilted aft over the southern part of the sunlit half orbit and forward over the northern part, with a view tailored to the analysis time step.
    platforms: [pace]
    velocity_frame: earth_fixed
    instruments:
      - type: pointed
        parameters:
          name: OCI
          field_of_regard: 120
          cross_track_field_of_view: 113.235
          along_track_field_of_view: {tailor: time_step}
          pitch_angle_profile:
            - [1.574, 19.8555]
            - [179.9, 19.8555]
            - [180.1, -19.8149]
            - [359.893, -19.8149]
          is_rectangular: true
        provenance:
          field_of_regard:
            kind: derived
            source: Contains the tilted view, whose edges are about 58.8 deg from nadir, with a margin for its along-track extent
          cross_track_field_of_view:
            kind: measured
            source: validate_catalog_oci.py --fit, between the outermost samples in the tilted view (113.234 deg forward, 113.237 deg aft)
            platform: pace
            period: "2026-10-04"
          along_track_field_of_view:
            kind: derived
            source: compute_along_track_field_of_view, from the orbit and time step
          pitch_angle_profile:
            kind: measured
            source: validate_catalog_oci.py --fit, the along-track angle of the samples forward and aft, and the arguments of latitude (from latitude) at which the tilt changes after the ascending node, over about 26 s; the change back is placed in the dark half orbit, which has no data
            platform: pace
            period: "2026-10-04"
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The tilt changes from aft to forward at a latitude that moves with the season, near that of the subsolar point; the profile places it just after the ascending node, where it was on 2026-10-04. On held-out data of 2026-11-04 the change came near 17 deg S, so over about 17 deg of latitude the view tilted the wrong way, predicting those passes about 73 s late, with extra passes, and lowering the swath's intersection over union (epochs within 72.6 s at the 95th percentile; 93.7% of predicted passes observed; intersection over union 0.951 at 10 s and 0.909 at 120 s). For other dates, set the profile's change to the latitude of the period analyzed.
      - The tilt changes back in the dark half of the orbit, where the product has no data, at an argument of latitude placed at 180 deg; analyses there describe a tilt that was not tested.
      - The scan line is rotated by about 0.1 deg from perpendicular to the Earth-fixed ground track (a fitted yaw), which is not modeled.
      - The swath width of a pointed instrument follows its field of regard, centered on nadir, which does not describe this tilted view; its width is that between the projections of its edges.
      - OCI images the sunlit half of each orbit, whereas the view observes whenever a target is in view, unless a solar limit is added.
limitations:
  - PACE flies with yaw steering, and the scan is nearly perpendicular to the Earth-fixed ground track, so the configuration uses the Earth-fixed frame.
  - No configuration gives sample sizes, as no published instantaneous field of view was used.
  - The tilt schedule is that of the days tested; it is set by the mission and may change.
