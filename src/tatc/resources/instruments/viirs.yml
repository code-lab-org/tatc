id: viirs
name: VIIRS
aliases: [Visible Infrared Imaging Radiometer Suite]
instrument_class: cross_track
selection: Cross-track imager of the Joint Polar Satellite System, with open data products, and NASA's recommended successor to MODIS.
platforms: [noaa-20, noaa-21, suomi-npp]
data_products:
  - name: VIIRS terrain-corrected moderate-resolution geolocation (GMTCO)
    provider: NOAA Open Data Dissemination
    url: https://registry.opendata.aws/noaa-jpss/
    access: open
default_configuration: swath_noaa_20
configurations:
  swath_noaa_20:
    grade: coverage
    description: NOAA-20's swath scanned between the outermost moderate-resolution pixel centers, with a view tailored to the analysis time step.
    platforms: [noaa-20]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: VIIRS
          field_of_regard: 112.0944
          cross_track_field_of_view: 112.0944
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &measured_extent
            kind: measured
            source: ValidateImagerVIIRS, Test 2, between the outermost samples (printed to 4 decimals)
            platforms: [noaa-20]
            period: "2026-10-02"
          cross_track_field_of_view: *measured_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The view is centered on nadir. The outermost samples measure 55.96 deg to the left and 56.13 deg to the right.
      - Epochs are tested only to about 2 s, because reference times are interpolated from granule outlines, so this configuration is at the coverage grade.
  swath_noaa_21:
    grade: coverage
    description: NOAA-21's swath scanned between the outermost moderate-resolution pixel centers, with a view tailored to the analysis time step.
    platforms: [noaa-21]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: VIIRS
          field_of_regard: 111.8951
          cross_track_field_of_view: 111.8951
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &noaa_21_extent
            kind: measured
            source: validate_catalog_viirs.py --fit, between the outermost samples
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_field_of_view: *noaa_21_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The view is centered on nadir. The outermost samples measure 55.92 deg to the left and 55.98 deg to the right, about 0.2 deg narrower in all than on NOAA-20.
      - The scan line looks 0.18 deg aft at nadir (about 2.7 km), and is rotated by 0.06 deg, which are not modeled.
      - Epochs are tested only to about 2 s, because reference times are interpolated from granule outlines, so this configuration is at the coverage grade.
  swath_suomi_npp:
    grade: coverage
    description: Suomi NPP's swath scanned between the outermost moderate-resolution pixel centers, with a view tailored to the analysis time step.
    platforms: [suomi-npp]
    velocity_frame: inertial
    instruments:
      - type: pointed
        parameters:
          name: VIIRS
          field_of_regard: 112.5487
          cross_track_field_of_view: 112.5487
          along_track_field_of_view: {tailor: time_step}
          is_swept: true
          is_rectangular: true
        provenance:
          field_of_regard: &suomi_npp_extent
            kind: measured
            source: validate_catalog_viirs.py --fit, between the outermost samples
            platforms: [suomi-npp]
            period: "2026-10-02"
          cross_track_field_of_view: *suomi_npp_extent
          is_rectangular:
            kind: derived
            source: Models a scanned swath as a rectangular view
    limitations:
      - The view is centered on nadir. The outermost samples measure 56.25 deg to the left and 56.30 deg to the right, about 0.45 deg wider in all than on NOAA-20.
      - The scan line is rotated by 0.11 deg, and looks 0.04 deg along track at nadir (about 0.6 km), which are not modeled.
      - Epochs are tested only to about 2 s, because reference times are interpolated from granule outlines, so this configuration is at the coverage grade.
      - Suomi NPP was retired on 2026-11-02, when NOAA stopped delivering its data.
  zones_noaa_20:
    grade: sample_size
    description: NOAA-20's five on-board aggregation zones of the moderate-resolution bands across a scan, from right to left. Analyze one at a time with its instrument index, or by the zone of each scan angle.
    platforms: [noaa-20]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 2
    instruments:
      - type: pointed
        parameters: &zone_parameters
          name: VIIRS zone 0
          field_of_regard: 112.56
          cross_track_field_of_view: 11.38304
          along_track_field_of_view: 0.81664
          cross_track_pixels: 640
          along_track_pixels: 16
          roll_angle: -50.447
          view_geometry: scan
          is_rectangular: true
          scan_period: 1.786584
        provenance: &zone_provenance
          field_of_regard:
            kind: nominal
            source: The nominal scan half-angle of 56.28 deg
          cross_track_field_of_view: &measured_zone
            kind: measured
            source: ValidateSampleSizes, Test 1, the zone's pixels and spacing (printed to 3 decimals)
            platforms: [noaa-20]
            period: "2026-10-02"
          along_track_field_of_view: &measured_array
            kind: measured
            source: ValidateImagerVIIRS, Test 2, 16 detectors of 0.05104 deg
            platforms: [noaa-20]
            period: "2026-10-02"
          cross_track_pixels: *measured_zone
          along_track_pixels:
            kind: nominal
            source: The moderate-resolution bands have 16 detectors
          roll_angle: *measured_zone
          view_geometry:
            kind: derived
            source: A scanner keeps a constant angular extent along track (ValidateImagerVIIRS, Test 3)
          is_rectangular:
            kind: derived
            source: Models a scan as a rectangular view
          scan_period:
            kind: measured
            source: ValidateImagerVIIRS, the median period between scans
            platforms: [noaa-20]
            period: "2026-10-02"
      - type: pointed
        parameters:
          <<: *zone_parameters
          name: VIIRS zone 1
          cross_track_field_of_view: 13.056759
          cross_track_pixels: 367
          roll_angle: -38.228
        provenance: *zone_provenance
      - type: pointed
        parameters:
          <<: *zone_parameters
          name: VIIRS zone 2
          cross_track_field_of_view: 63.164032
          cross_track_pixels: 1184
          roll_angle: -0.134
        provenance: *zone_provenance
      - type: pointed
        parameters:
          <<: *zone_parameters
          name: VIIRS zone 3
          cross_track_field_of_view: 13.091232
          cross_track_pixels: 368
          roll_angle: 37.999
        provenance: *zone_provenance
      - type: pointed
        parameters:
          <<: *zone_parameters
          name: VIIRS zone 4
          cross_track_field_of_view: 11.402749
          cross_track_pixels: 641
          roll_angle: 50.262
        provenance: *zone_provenance
    limitations:
      - The zones are of the moderate-resolution (M) bands, not the imagery (I) bands.
      - A single PointedInstrument of equal pixels cannot represent VIIRS's aggregation zones, so a scan needs all five instruments.
  zones_noaa_21:
    grade: sample_size
    description: NOAA-21's five on-board aggregation zones of the moderate-resolution bands across a scan, from right to left. Analyze one at a time with its instrument index, or by the zone of each scan angle.
    platforms: [noaa-21]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 2
    instruments:
      - type: pointed
        parameters: &noaa_21_zone_parameters
          name: VIIRS zone 0
          field_of_regard: 112.56
          cross_track_field_of_view: 11.361986
          along_track_field_of_view: 0.81696
          cross_track_pixels: 640
          along_track_pixels: 16
          roll_angle: -50.306
          view_geometry: scan
          is_rectangular: true
          scan_period: 1.789745
        provenance: &noaa_21_zone_provenance
          field_of_regard:
            kind: nominal
            source: The nominal scan half-angle of 56.28 deg
          cross_track_field_of_view: &noaa_21_measured_zone
            kind: measured
            source: validate_catalog_viirs.py --fit, the zone's pixels and median spacing
            platforms: [noaa-21]
            period: "2026-11-05"
          along_track_field_of_view:
            kind: measured
            source: validate_catalog_viirs.py --fit, 16 detectors of 0.05106 deg
            platforms: [noaa-21]
            period: "2026-11-05"
          cross_track_pixels:
            kind: nominal
            source: The pixels of the zone, by which the validation assigns samples to zones
          along_track_pixels:
            kind: nominal
            source: The moderate-resolution bands have 16 detectors
          roll_angle: *noaa_21_measured_zone
          view_geometry:
            kind: derived
            source: A scanner keeps a constant angular extent along track (ValidateImagerVIIRS, Test 3)
          is_rectangular:
            kind: derived
            source: Models a scan as a rectangular view
          scan_period:
            kind: measured
            source: validate_catalog_viirs.py --fit, the median period between scans
            platforms: [noaa-21]
            period: "2026-11-05"
      - type: pointed
        parameters:
          <<: *noaa_21_zone_parameters
          name: VIIRS zone 1
          cross_track_field_of_view: 13.030856
          cross_track_pixels: 367
          roll_angle: -38.109
        provenance: *noaa_21_zone_provenance
      - type: pointed
        parameters:
          <<: *noaa_21_zone_parameters
          name: VIIRS zone 2
          cross_track_field_of_view: 63.056364
          cross_track_pixels: 1184
          roll_angle: -0.079
        provenance: *noaa_21_zone_provenance
      - type: pointed
        parameters:
          <<: *noaa_21_zone_parameters
          name: VIIRS zone 3
          cross_track_field_of_view: 13.067663
          cross_track_pixels: 368
          roll_angle: 37.991
        provenance: *noaa_21_zone_provenance
      - type: pointed
        parameters:
          <<: *noaa_21_zone_parameters
          name: VIIRS zone 4
          cross_track_field_of_view: 11.380709
          cross_track_pixels: 641
          roll_angle: 50.232
        provenance: *noaa_21_zone_provenance
    limitations:
      - The zones are of the moderate-resolution (M) bands, not the imagery (I) bands.
      - A single PointedInstrument of equal pixels cannot represent VIIRS's aggregation zones, so a scan needs all five instruments.
      - The zones are measured with validate_catalog_viirs.py --fit as ValidateSampleSizes measured NOAA-20's, which it reproduces within 0.003 deg (roll) and 0.0025 deg (field of view) on NOAA-20's data.
  zones_suomi_npp:
    grade: sample_size
    description: Suomi NPP's five on-board aggregation zones of the moderate-resolution bands across a scan, from right to left. Analyze one at a time with its instrument index, or by the zone of each scan angle.
    platforms: [suomi-npp]
    velocity_frame: inertial
    grouping: alternatives
    instrument_index: 2
    instruments:
      - type: pointed
        parameters: &suomi_npp_zone_parameters
          name: VIIRS zone 0
          field_of_regard: 112.62
          cross_track_field_of_view: 11.42761
          along_track_field_of_view: 0.81968
          cross_track_pixels: 640
          along_track_pixels: 16
          roll_angle: -50.591
          view_geometry: scan
          is_rectangular: true
          scan_period: 1.77928
        provenance: &suomi_npp_zone_provenance
          field_of_regard:
            kind: derived
            source: Contains the outermost edges of the zones, measured with validate_catalog_viirs.py --fit at 56.26 deg left and 56.30 deg right
          cross_track_field_of_view: &suomi_npp_measured_zone
            kind: measured
            source: validate_catalog_viirs.py --fit, the zone's pixels and median spacing
            platforms: [suomi-npp]
            period: "2026-10-02"
          along_track_field_of_view:
            kind: measured
            source: validate_catalog_viirs.py --fit, 16 detectors of 0.05123 deg
            platforms: [suomi-npp]
            period: "2026-10-02"
          cross_track_pixels:
            kind: nominal
            source: The pixels of the zone, by which the validation assigns samples to zones
          along_track_pixels:
            kind: nominal
            source: The moderate-resolution bands have 16 detectors
          roll_angle: *suomi_npp_measured_zone
          view_geometry:
            kind: derived
            source: A scanner keeps a constant angular extent along track (ValidateImagerVIIRS, Test 3)
          is_rectangular:
            kind: derived
            source: Models a scan as a rectangular view
          scan_period:
            kind: measured
            source: validate_catalog_viirs.py --fit, the median period between scans
            platforms: [suomi-npp]
            period: "2026-10-02"
      - type: pointed
        parameters:
          <<: *suomi_npp_zone_parameters
          name: VIIRS zone 1
          cross_track_field_of_view: 13.107694
          cross_track_pixels: 367
          roll_angle: -38.323
        provenance: *suomi_npp_zone_provenance
      - type: pointed
        parameters:
          <<: *suomi_npp_zone_parameters
          name: VIIRS zone 2
          cross_track_field_of_view: 63.424835
          cross_track_pixels: 1184
          roll_angle: -0.072
        provenance: *suomi_npp_zone_provenance
      - type: pointed
        parameters:
          <<: *suomi_npp_zone_parameters
          name: VIIRS zone 3
          cross_track_field_of_view: 13.143019
          cross_track_pixels: 368
          roll_angle: 38.219
        provenance: *suomi_npp_zone_provenance
      - type: pointed
        parameters:
          <<: *suomi_npp_zone_parameters
          name: VIIRS zone 4
          cross_track_field_of_view: 11.448389
          cross_track_pixels: 641
          roll_angle: 50.533
        provenance: *suomi_npp_zone_provenance
    limitations:
      - The zones are of the moderate-resolution (M) bands, not the imagery (I) bands.
      - A single PointedInstrument of equal pixels cannot represent VIIRS's aggregation zones, so a scan needs all five instruments.
      - The zones are measured with validate_catalog_viirs.py --fit as ValidateSampleSizes measured NOAA-20's, which it reproduces within 0.003 deg (roll) and 0.0025 deg (field of view) on NOAA-20's data.
      - Suomi NPP was retired on 2026-11-02, when NOAA stopped delivering its data.
limitations:
  - Each platform's configurations are fitted on its own data, NOAA-20's swath and zones with the notebooks, and NOAA-21's and Suomi NPP's with validate_catalog_viirs.py --fit. NOAA-20's configurations on NOAA-21 are a transfer that warns on use; on 2026-11-05, every pass was found, with epochs within 2.2 s (95th percentile), but the swath width differed by 21.0 km, and the zones' pixels lay 3.2 km from the samples (median), within the gate.
