id: gpm
name: Global Precipitation Measurement Core Observatory
aliases: [GPM]
system_class: inclined
selection: The reference satellite of the GPM constellation, in a precessing orbit that samples every local time.
operator: NASA and JAXA
spacecraft:
  - id: gpm
    name: GPM Core Observatory
    norad_id: 39574
    status: operational
    as_of: 2026-10-03
    resources: &resources_gpm
      launch_mass: 3850
      power: 1950
      design_life: 3
      downlink_rate: 2300000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, GPM: \"The GPM spacecraft has a mass of about 3850 kg\" (https://www.eoportal.org/satellite-missions/gpm)"
        power:
          kind: nominal
          source: "eoPortal, GPM: \"a power of ~1.95 kW\" (https://www.eoportal.org/satellite-missions/gpm)"
        design_life:
          kind: nominal
          source: "eoPortal, GPM: \"The design life is 3 years\" (https://www.eoportal.org/satellite-missions/gpm)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, GPM: \"~2.3 Mbit/s in SA mode\" (https://www.eoportal.org/satellite-missions/gpm); through TDRS"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      gpm: {type: circular, mean_altitude: 438370, inclination: 64.9690}
    provenance:
      gpm:
        mean_altitude: &gpm
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [gpm]
          period: "2026-07-15"
        inclination: *gpm
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (each spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
