id: pace
name: Plankton, Aerosol, Cloud, ocean Ecosystem
aliases: [PACE]
system_class: sun_synchronous
selection: NASA's ocean color and aerosol mission.
operator: NASA
spacecraft:
  - id: pace
    name: PACE
    norad_id: 58928
    status: operational
    as_of: 2026-11-10
    resources: &resources_pace
      launch_mass: 1694
      power: 2700
      design_life: 3
      downlink_rate: 600000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, PACE: \"The total spacecraft mass is 1694 kg, including approximately 235 kg of hydrazine propellant.\" (https://www.eoportal.org/satellite-missions/pace-mission)"
        power:
          kind: nominal
          source: "eoPortal, PACE: \"generating up to 2.7 kW at the beginning of life\" (https://www.eoportal.org/satellite-missions/pace-mission)"
        design_life:
          kind: nominal
          source: "eoPortal, PACE: \"designed for a three-year primary mission\" (https://www.eoportal.org/satellite-missions/pace-mission)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, PACE: \"Ka-band for high-rate downlink of science data at 600 Mbps\" (https://www.eoportal.org/satellite-missions/pace-mission)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      pace: {type: sso, mean_altitude: 682140, equator_crossing_time: "12:56:07"}
    provenance:
      pace:
        mean_altitude: &pace
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [pace]
          period: "2026-11-08"
        equator_crossing_time: *pace
    limitations:
      - The satellites' phases in their planes are arbitrary (spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
