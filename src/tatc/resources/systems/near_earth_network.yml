id: near_earth_network
name: NASA Near Earth Network
aliases: [NEN, Near Space Network ground stations, KSAT, SSC, Kongsberg Satellite Services, Swedish Space Corporation]
system_class: ground_network
selection: The direct-to-Earth antennas of NASA's Near Earth Network (now part of the Near Space Network) as its users' guide of 2019 publishes them, NASA's own and the commercial antennas of KSAT, SSC, and SANSA that serve its missions, with their G/T and maximum rates, for the latency and data flow of concept studies.
operator: NASA Space Communications and Navigation (SCaN), with Kongsberg Satellite Services (KSAT), the Swedish Space Corporation (SSC), and the South African National Space Agency (SANSA)
stations:
  file: near_earth_network.csv
  as_of: 2019-03-14
  provenance:
    kind: nominal
    source: "The position of each antenna in Table 2-1 (\"NEN Overview\") of the NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019) (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf), or in its section where the table disagrees with it (TR2's longitude, and WS1, as cataloged in nasa_space_network); heights above sea level of TR3 and the Santiago antennas from their sections, and of South Point from SSC (\"situated 367M above sea level\", https://sscspace.com/services/satellite-ground-stations/our-stations/south-point-station/)"
default_configuration: all
configurations:
  all:
    grade: siting
    description: Every antenna of the network that receives data from satellites.
    members: [AS1, AS2, AS3, USAK01, USAK03, USAK04, USAK05, USHI01, USHI02, AUWA01, KU1S, KU2S, SA1, SA2, SA3, SG1, SG2, SG3, TR2, TR3, SI1, HBK01, HBK02, MG1, WG1, WG2, KUS, PDL, WS1]
    min_elevation_angle: 5
    provenance:
      members:
        kind: nominal
        source: "The receiving antennas of Table 2-1 of the NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019) (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
      min_elevation_angle: &min_elevation
        kind: placeholder
        source: An assumption of the elevation above which an antenna contacts a satellite (the guide states G/T at 5 deg in S-band and 10 deg in X-band), not a published mask; give the angle of a study when building stations (build(min_elevation_angle=...))
  ksat:
    grade: siting
    description: The antennas of Kongsberg Satellite Services (KSAT), at Svalbard, TrollSat, and Singapore.
    members: [SG1, SG2, SG3, TR2, TR3, SI1]
    min_elevation_angle: 5
    provenance:
      members:
        kind: nominal
        source: "The operators of the antennas in Table 2-1 of the NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019) (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
      min_elevation_angle: *min_elevation
  ssc:
    grade: siting
    description: The antennas of the Swedish Space Corporation (SSC), at North Pole, South Point, Dongara, Esrange, and Santiago.
    members: [USAK01, USAK03, USAK04, USAK05, USHI01, USHI02, AUWA01, KU1S, KU2S, SA1, SA2, SA3]
    min_elevation_angle: 5
    provenance:
      members:
        kind: nominal
        source: "The operators of the antennas in Table 2-1 of the NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019) (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
      min_elevation_angle: *min_elevation
  nasa:
    grade: siting
    description: The antennas of NASA, at the Alaska Satellite Facility, McMurdo, Wallops, the Kennedy area, and White Sands.
    members: [AS1, AS2, AS3, MG1, WG1, WG2, KUS, PDL, WS1]
    min_elevation_angle: 5
    provenance:
      members:
        kind: nominal
        source: "The operators of the antennas in Table 2-1 of the NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019) (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
