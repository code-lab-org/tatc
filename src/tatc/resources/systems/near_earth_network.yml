            source: "NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019), Sec. 9, Table 9-3: \"G/T 46.98 dB/K, 10° elevation, clear sky\" (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
          max_data_rate:
            kind: nominal
            source: "NASA Near Earth Network Users' Guide (453-NENUG, Revision 4, 2019), Sec. 9, Table 9-3: \"Data Rate 235 Mbps single decoder mode 470 Mbps dual decoder (I&Q)\" (https://essp.larc.nasa.gov/EVI-6/pdf_files/453-UG-002905.pdf)"
    provenance:
      antennas: *one_antenna
limitations:
  - "The guide (Revision 4, 2019) expired in 2024 and the network, now part of the Near Space Network, relies on a changing set of commercial antennas, so stations may have been added, upgraded, or retired; KSAT's and SSC's other sites (such as Inuvik, Awarua, Punta Arenas, and Mauritius) are not in the guide and are not included."
  - "G/T is stated clear sky, at 5 deg elevation in S-band and 10 deg in X-band (WG1's S-band at 41 deg); the station sections' values are used where they differ from Table 2-1 (SG2, SI1, AS1, AS3, USAK03, KU1S, HBK02, WS1), and HBK01 and HBK02 are given by the guide for information only."
  - "The maximum rate of a receiver is the X-band (or Ka-band) demodulator's published range (per channel where so stated); no S-band maximum is given, and KU1S's, KU2S's, and HBK02's X-band rates are not stated."
  - "Heights above sea level are published only for TR3, the Santiago antennas, and South Point; the others are taken as sea level (their antennas are higher, which changes the time in view of a satellite negligibly)."
  - "Each antenna is a station with one antenna, so antennas at one site are scheduled independently (a site's antennas may share a backhaul, which is not modeled)."
