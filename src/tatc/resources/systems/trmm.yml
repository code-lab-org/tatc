id: trmm
name: Tropical Rainfall Measuring Mission
aliases: [TRMM]
system_class: inclined
selection: The predecessor of GPM, in a precessing tropical orbit (retired in 2015).
operator: NASA and JAXA
spacecraft:
  - id: trmm
    name: TRMM
    norad_id: 25063
    status: retired
    as_of: 2015-04-15
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      trmm: {type: circular, mean_altitude: 405460, inclination: 34.9589}
    provenance:
      trmm:
        mean_altitude: &trmm
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [trmm]
          period: "2013-05-20"
        inclination: *trmm
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
