id: trmm
name: Tropical Rainfall Measuring Mission
aliases: [TRMM]
system_class: inclined
selection: The predecessor of GPM, in a precessing tropical orbit (retired in 2015).
operator: NASA and JAXA
spacecraft:
  - id: trmm
    name: TRMM
    norad_id: 25063
    status: retired
    as_of: 2015-04-15
    resources: &resources_trmm
      launch_mass: 3620
      dry_mass: 2730
      power: 1100
      design_life: 3
      downlink_rate: 2000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, TRMM: \"the S/C mass = 3620 kg (including 890 kg of fuel)\" (https://www.eoportal.org/satellite-missions/trmm)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, TRMM: \"Dry mass 2730 kg\" (https://space.oscar.wmo.int/satellites/view/trmm)"
        power:
          kind: nominal
          source: "eoPortal, TRMM: \"Two solar panels provide 1100 W of power (850 W average)\" (https://www.eoportal.org/satellite-missions/trmm)"
        design_life:
          kind: nominal
          source: "eoPortal, TRMM: \"design life = 3 years\" (https://www.eoportal.org/satellite-missions/trmm)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, TRMM: \"Via TDRS, 32 kbit/s (real time), 2 Mbit/s (playback)\" (https://www.eoportal.org/satellite-missions/trmm)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      trmm: {type: circular, mean_altitude: 405460, inclination: 34.9589}
    provenance:
      trmm:
        mean_altitude: &trmm
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [trmm]
          period: "2013-05-20"
        inclination: *trmm
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (each spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
