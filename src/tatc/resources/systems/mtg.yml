id: mtg
name: Meteosat Third Generation
aliases: [MTG]
system_class: geostationary
selection: Europe's geostationary weather satellites, whose imagers observe Europe and Africa.
operator: EUMETSAT
spacecraft:
  - id: meteosat-12
    name: Meteosat-12 (MTG-I1)
    norad_id: 54743
    status: operational
    as_of: 2026-11-17
    resources: &resources_meteosat_12
      launch_mass: 3600
      dry_mass: 1600
      power: 2000
      design_life: 8.5
      downlink_rate: 165000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Meteosat-12: \"Mass at launch 3600 kg\" (https://space.oscar.wmo.int/satellites/view/meteosat_12)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Meteosat-12: \"Dry mass 1600 kg\" (https://space.oscar.wmo.int/satellites/view/meteosat_12)"
        power:
          kind: nominal
          source: "eoPortal, Meteosat Third Generation: \"Spacecraft power 2 kW\" (https://www.eoportal.org/satellite-missions/meteosat-third-generation); of MTG-I"
        design_life:
          kind: nominal
          source: "eoPortal, Meteosat Third Generation: \"The satellites have a nominal design life of 8.5 years.\" (https://www.eoportal.org/satellite-missions/meteosat-third-generation)"
        downlink_rate:
          kind: nominal
          source: "WMO OSCAR/Space, Meteosat-12: \"MDA ... 165000 kbps Mission Data Acquisition\" (https://space.oscar.wmo.int/satellites/view/meteosat_12)"
default_configuration: slot
configurations:
  slot:
    grade: ground_track
    description: The longitude of each satellite's subpoint, maintained by station-keeping, from its element set.
    orbits:
      meteosat-12: {type: geosynchronous, longitude: -0.294, inclination: 0.77}
    provenance:
      meteosat-12:
        longitude: &meteosat_12
          kind: measured
          source: validate_system_orbits.py --fit, the mean over the day after the element set nearest the middle of the day
          platforms: [meteosat-12]
          period: "2026-11-18"
        inclination: *meteosat_12
    limitations:
      - The satellites are kept at their mean longitudes and inclinations, without the daily motion of the subpoint within the station-keeping box.
