id: sentinel_3
name: Copernicus Sentinel-3
aliases: [Sentinel-3]
system_class: sun_synchronous
selection: Europe's ocean and land color, temperature, and altimetry constellation.
operator: ESA and EUMETSAT
spacecraft:
  - id: sentinel-3a
    name: Sentinel-3A
    norad_id: 41335
    status: operational
    as_of: 2026-11-04
    resources: &resources_sentinel_3
      launch_mass: 1250
      dry_mass: 1150
      power: 2050
      design_life: 7.5
      storage: 300000000000
      downlink_rate: 520000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Sentinel-3A: \"Mass at launch 1250 kg\" (https://space.oscar.wmo.int/satellites/view/sentinel_3a); the same for Sentinel-3B"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Sentinel-3A: \"Dry mass 1150 kg\" (https://space.oscar.wmo.int/satellites/view/sentinel_3a); the same for Sentinel-3B"
        power:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-1: \"1250 kg 3.9 m x 2.2 m x 2.2 m 2.05 kW (EOL)\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-1); Sentinel-3 in the table comparing Sentinels 1, 2, and 3"
        design_life:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-3: \"The design life is 7.5 years\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
        storage:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-3: \"An onboard data storage capacity of 300 Gbit (EOL)\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-3: \"The X-band provide the payload data downlink at a rate of 520 Mbit/s.\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
    communications:
      transmitters:
        - name: X-band payload data
          band: X
          max_data_rate: 520000000.0
          provenance:
            band:
              kind: nominal
              source: "eoPortal, Copernicus Sentinel-3 (the series): \"The X-band provide the payload data downlink at a rate of 520 Mbit/s.\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
            max_data_rate:
              kind: nominal
              source: "eoPortal, Copernicus Sentinel-3 (the series): \"The X-band provide the payload data downlink at a rate of 520 Mbit/s.\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
  - id: sentinel-3b
    name: Sentinel-3B
    norad_id: 43437
    status: operational
    as_of: 2026-11-17
    resources: *resources_sentinel_3
    communications:
      transmitters:
        - name: X-band payload data
          band: X
          max_data_rate: 520000000.0
          provenance:
            band:
              kind: nominal
              source: "eoPortal, Copernicus Sentinel-3 (the series): \"The X-band provide the payload data downlink at a rate of 520 Mbit/s.\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
            max_data_rate:
              kind: nominal
              source: "eoPortal, Copernicus Sentinel-3 (the series): \"The X-band provide the payload data downlink at a rate of 520 Mbit/s.\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-3)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      sentinel-3a: {type: sso, mean_altitude: 809790, equator_crossing_time: "22:00:26", phase: 0}
      sentinel-3b: {type: sso, mean_altitude: 809790, equator_crossing_time: "22:01:02", phase: 140}
    provenance:
      sentinel-3a:
        mean_altitude: &sentinel_3a
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [sentinel-3a]
          period: "2026-11-08"
        equator_crossing_time: *sentinel_3a
        phase:
          kind: nominal
          source: The reference of the constellation's relative phases (zero)
      sentinel-3b:
        mean_altitude: &sentinel_3b
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [sentinel-3b]
          period: "2026-11-18"
        equator_crossing_time: *sentinel_3b
        phase:
          kind: measured
          source: ESA's phasing of Sentinel-3B, 140 deg from Sentinel-3A in their plane, ahead of it as their element sets of 2026-11-21 show (137.8 deg)
          platforms: [sentinel-3a, sentinel-3b]
          period: "2026-11-21"
    limitations:
      - The satellites keep the operator's relative phases (and planes), but the constellation's phase in its plane is arbitrary (relative phases are counted from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
