id: timed
name: TIMED
aliases: [Thermosphere Ionosphere Mesosphere Energetics and Dynamics]
system_class: inclined
selection: NASA's mission of the mesosphere and lower thermosphere, in a precessing orbit.
operator: NASA
spacecraft:
  - id: timed
    name: TIMED
    norad_id: 26998
    status: extended
    as_of: 2026-11-13
    resources: &resources_timed
      launch_mass: 660
      dry_mass: 587
      power: 426
      design_life: 2
      storage: 2500000000
      downlink_rate: 4000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, TIMED: \"S/C mass = 660 kg\" (https://www.eoportal.org/satellite-missions/timed)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, TIMED: \"Dry mass 587 kg\" (https://space.oscar.wmo.int/satellites/view/timed)"
        power:
          kind: nominal
          source: "eoPortal, TIMED: \"power = 426 W (solar panels, 50 Ah Ni-H 2 battery)\" (https://www.eoportal.org/satellite-missions/timed)"
        design_life:
          kind: nominal
          source: "eoPortal, TIMED: \"mission design life = 2 years\" (https://www.eoportal.org/satellite-missions/timed)"
        storage:
          kind: nominal
          source: "eoPortal, TIMED: \"SSR (Solid State Recorder), 2.5 Gbit capacity\" (https://www.eoportal.org/satellite-missions/timed)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, TIMED: \"High-rate modulation 4 Mbit/s with DQPSK modulation\" (https://www.eoportal.org/satellite-missions/timed)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      timed: {type: circular, mean_altitude: 588250, inclination: 74.0671}
    provenance:
      timed:
        mean_altitude: &timed
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [timed]
          period: "2026-08-15"
        inclination: *timed
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (each spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
