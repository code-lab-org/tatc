default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      formosat-7-1: {type: circular, mean_altitude: 583120, inclination: 23.9983}
      formosat-7-2: {type: circular, mean_altitude: 583110, inclination: 23.9972}
      formosat-7-3: {type: circular, mean_altitude: 540730, inclination: 23.9979}
      formosat-7-4: {type: circular, mean_altitude: 583120, inclination: 23.9970}
      formosat-7-5: {type: circular, mean_altitude: 583080, inclination: 23.9999}
      formosat-7-6: {type: circular, mean_altitude: 583100, inclination: 23.9993}
    provenance:
      formosat-7-1:
        mean_altitude: &formosat_7_1
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-1]
          period: "2026-11-18"
        inclination: *formosat_7_1
      formosat-7-2:
        mean_altitude: &formosat_7_2
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-2]
          period: "2026-11-17"
        inclination: *formosat_7_2
      formosat-7-3:
        mean_altitude: &formosat_7_3
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-3]
          period: "2026-11-18"
        inclination: *formosat_7_3
      formosat-7-4:
        mean_altitude: &formosat_7_4
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-4]
          period: "2026-11-17"
        inclination: *formosat_7_4
      formosat-7-5:
        mean_altitude: &formosat_7_5
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-5]
          period: "2026-11-18"
        inclination: *formosat_7_5
      formosat-7-6:
        mean_altitude: &formosat_7_6
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [formosat-7-6]
          period: "2026-11-18"
        inclination: *formosat_7_6
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
