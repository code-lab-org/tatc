id: cosmic_2
name: FORMOSAT-7/COSMIC-2
aliases: [COSMIC-2]
system_class: inclined
selection: A constellation of radio occultation receivers in low-inclination orbits.
operator: TASA and NOAA
spacecraft:
  - id: formosat-7-1
    name: FORMOSAT-7/COSMIC-2 FM1
    norad_id: 44349
    status: operational
    as_of: 2026-11-15
  - id: formosat-7-2
    name: FORMOSAT-7/COSMIC-2 FM2
    norad_id: 44351
