id: sentinel_6
name: Copernicus Sentinel-6
aliases: [Sentinel-6, Jason-CS]
system_class: inclined
selection: The reference ocean altimetry mission, in the non-sun-synchronous orbit of TOPEX/Poseidon and Jason.
operator: ESA, EUMETSAT, NASA, and NOAA
spacecraft:
  - id: sentinel-6a
    name: Sentinel-6 Michael Freilich
    norad_id: 46984
    status: operational
    as_of: 2026-11-09
    resources: &resources_sentinel_6
      launch_mass: 1440
      dry_mass: 1191
      power: 1000
      design_life: 5.5
      downlink_rate: 150000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Sentinel-6A: \"Mass at launch 1440 kg\" (https://space.oscar.wmo.int/satellites/view/sentinel_6a); the same for Sentinel-6B"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Sentinel-6A: \"Dry mass 1191 kg\" (https://space.oscar.wmo.int/satellites/view/sentinel_6a); the same for Sentinel-6B"
        power:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-6: \"about 1 kW average in flight\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-6); nearly 5.5 kW at beginning of life"
        design_life:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-6: \"each a nominal lifetime of 5.5 years\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-6)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, Copernicus Sentinel-6: \"transmitting them at 150 Mbit/s\" (https://www.eoportal.org/satellite-missions/copernicus-sentinel-6)"
  - id: sentinel-6b
    name: Sentinel-6B
    norad_id: 66514
    status: operational
    as_of: 2026-11-09
    resources: *resources_sentinel_6
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      sentinel-6a: {type: circular, mean_altitude: 1344860, inclination: 66.0401, right_ascension_ascending_node: 0, phase: 0}
      sentinel-6b: {type: circular, mean_altitude: 1344860, inclination: 66.0401, right_ascension_ascending_node: 0, phase: 358.4}
    provenance:
      sentinel-6a:
        mean_altitude: &sentinel_6a
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [sentinel-6a]
          period: "2026-11-09"
        inclination: *sentinel_6a
        right_ascension_ascending_node: &sentinel_6_phasing
          kind: nominal
          source: The tandem phase of Sentinel-6B, about 30 s (1.6 deg) behind Sentinel-6 Michael Freilich in the same plane (EUMETSAT and ESA), consistent with their element sets of 2026-11-21
        phase: *sentinel_6_phasing
      sentinel-6b:
        mean_altitude: &sentinel_6b
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [sentinel-6b]
          period: "2026-11-09"
        inclination: *sentinel_6b
        right_ascension_ascending_node: *sentinel_6_phasing
        phase: *sentinel_6_phasing
    limitations:
      - The satellites keep the operator's relative phases (and planes), but the constellation's phase in its plane is arbitrary (relative phases are counted from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
      - The satellites fly in tandem (Sentinel-6B about 30 s behind Sentinel-6 Michael Freilich) for cross-calibration; Sentinel-6 Michael Freilich is to move to another orbit after the tandem phase (from late 2026), which this configuration does not represent.
