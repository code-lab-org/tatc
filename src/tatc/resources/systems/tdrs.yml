      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, TDRS: \"The second generation of TDRS uses the Boeing BSS-601 satellite platform. ... with a launch mass of 3196 kg.\" (https://www.eoportal.org/satellite-missions/tdrs)"
        power:
          kind: nominal
          source: "eoPortal, TDRS: \"two bus-mounted silicon solar arrays, providing up to 2300 W of power\" (https://www.eoportal.org/satellite-missions/tdrs); of the second generation"
