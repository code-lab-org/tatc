id: tdrs
name: Tracking and Data Relay Satellite System
aliases: [TDRSS, TDRS, Space Network]
system_class: geostationary
role: relaying
selection: NASA's geostationary data relay satellites, which relay the data of satellites in low Earth orbit (such as the ISS and Hubble) to ground terminals.
operator: NASA
spacecraft:
  - id: tdrs-3
    name: TDRS 3
    norad_id: 19548
    status: retired
    as_of: 2026-05-22
    resources: &resources_tdrs_first
      launch_mass: 2100
      power: 1700
      design_life: 10
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, TDRS: \"with a launch mass of approximately 2100 kg\" (https://www.eoportal.org/satellite-missions/tdrs); of the first generation"
        power:
          kind: nominal
          source: "eoPortal, TDRS: \"providing 2 kW of beginning-of-life (BOL) power generation and 1.7 kW at end-of-life (EOL)\" (https://www.eoportal.org/satellite-missions/tdrs); of the first generation"
        design_life:
          kind: nominal
          source: "Gunter's Space Page, TDRS 1-7: \"Lifetime: 10 years (design)\" (https://space.skyrocket.de/doc_sdat/tdrs-1.htm)"
  - id: tdrs-5
    name: TDRS 5
    norad_id: 21639
    status: retired
    as_of: 2026-05-22
    resources: *resources_tdrs_first
  - id: tdrs-6
    name: TDRS 6
    norad_id: 22314
    status: storage
    as_of: 2026-05-22
    resources: *resources_tdrs_first
  - id: tdrs-7
    name: TDRS 7
    norad_id: 23613
    status: storage
    as_of: 2026-05-22
    resources: *resources_tdrs_first
  - id: tdrs-8
    name: TDRS 8
    norad_id: 26388
    status: storage
    as_of: 2026-05-22
    resources: &resources_tdrs_second
      launch_mass: 3196
      power: 2300
