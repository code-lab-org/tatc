id: tropics
name: TROPICS
aliases: [Time-Resolved Observations of Precipitation structure and storm Intensity with a Constellation of Smallsats]
system_class: inclined
selection: A constellation of CubeSat microwave sounders in low-inclination orbits, revisiting tropical cyclones.
operator: NASA
spacecraft:
  - id: tropics-03
    name: TROPICS-03
    norad_id: 56753
    status: retired
    as_of: 2025-12-11
  - id: tropics-05
    name: TROPICS-05
    norad_id: 56442
    status: retired
    as_of: 2025-12-04
  - id: tropics-06
    name: TROPICS-06
    norad_id: 56444
    status: retired
    as_of: 2025-10-25
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      tropics-03: {type: circular, mean_altitude: 514010, inclination: 32.7361}
      tropics-05: {type: circular, mean_altitude: 512710, inclination: 32.7350}
      tropics-06: {type: circular, mean_altitude: 506870, inclination: 32.7348}
    provenance:
      tropics-03:
        mean_altitude: &tropics_03
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [tropics-03]
          period: "2024-08-01"
        inclination: *tropics_03
      tropics-05:
        mean_altitude: &tropics_05
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [tropics-05]
          period: "2024-08-01"
        inclination: *tropics_05
      tropics-06:
        mean_altitude: &tropics_06
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [tropics-06]
          period: "2024-08-01"
        inclination: *tropics_06
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
