id: himawari
name: Himawari
system_class: geostationary
selection: Japan's geostationary weather satellites, which observe East Asia and the western Pacific.
operator: Japan Meteorological Agency
spacecraft:
  - id: himawari-9
    name: Himawari-9
    norad_id: 41836
    status: operational
    as_of: 2026-11-09
    resources: &resources_himawari_9
      launch_mass: 3500
      dry_mass: 1300
      power: 2600
      design_life: 15
      downlink_rate: 66000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, Himawari-8/9: \"The launch mass is ~3500 kg, and the dry mass is 1300 kg.\" (https://www.eoportal.org/satellite-missions/himawari-8-9)"
        dry_mass:
          kind: nominal
          source: "eoPortal, Himawari-8/9: \"The launch mass is ~3500 kg, and the dry mass is 1300 kg.\" (https://www.eoportal.org/satellite-missions/himawari-8-9)"
        power:
          kind: nominal
          source: "WMO OSCAR/Space, Himawari-9: \"Power 2600 W\" (https://space.oscar.wmo.int/satellites/view/himawari_9)"
        design_life:
          kind: nominal
          source: "eoPortal, Himawari-8/9: \"15 years for the spacecraft bus\" (https://www.eoportal.org/satellite-missions/himawari-8-9); 8 years for AHI"
        downlink_rate:
          kind: nominal
          source: "eoPortal, Himawari-8/9: \"payload data is transmitted in Ka-band, with a data rate of 66 Mbit/s for AHI\" (https://www.eoportal.org/satellite-missions/himawari-8-9)"
    communications:
      transmitters:
        - name: Ka-band raw data
          band: Ka
          frequency: 18284600000.0
          max_data_rate: 66000000.0
          provenance:
            band:
              kind: nominal
              source: "eoPortal, Himawari-8 and -9: \"Ka-band for payload data transmission. The data rate is 66 Mbit/s for AHI\" (https://www.eoportal.org/satellite-missions/himawari-8-9)"
            max_data_rate:
              kind: nominal
              source: "eoPortal, Himawari-8 and -9: \"Ka-band for payload data transmission. The data rate is 66 Mbit/s for AHI\" (https://www.eoportal.org/satellite-missions/himawari-8-9)"
            frequency:
              kind: nominal
              source: "WMO OSCAR/Space, Himawari-9: \"CDAS | S-E | 18284.6 MHz | 110000 kHz | linear | D | 66000 kbps | Raw data\" (https://space.oscar.wmo.int/satellites/view/himawari_9)"
default_configuration: slot
configurations:
  slot:
    grade: ground_track
    description: The longitude of each satellite's subpoint, maintained by station-keeping, from its element set.
    orbits:
      himawari-9: {type: geosynchronous, longitude: 140.764, inclination: 0.04}
    provenance:
      himawari-9:
        longitude: &himawari_9
          kind: measured
          source: validate_system_orbits.py --fit, the mean over the day after the element set nearest the middle of the day
          platforms: [himawari-9]
          period: "2026-11-09"
        inclination: *himawari_9
    limitations:
      - The satellites are kept at their mean longitudes and inclinations, without the daily motion of the subpoint within the station-keeping box.
