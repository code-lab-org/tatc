id: eos
name: Earth Observing System
aliases: [EOS]
system_class: sun_synchronous
selection: NASA's flagship Earth observation satellites Terra, Aqua, and Aura, now drifting from their maintained local times.
operator: NASA
spacecraft:
  - id: terra
    name: Terra
    norad_id: 25994
    status: extended
    as_of: 2026-11-05
    resources: &resources_terra
      launch_mass: 5190
      dry_mass: 4864
      power: 2530
      design_life: 6
      downlink_rate: 150000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, Terra: \"the spacecraft has a total launch mass of 5190 kg\" (https://www.eoportal.org/satellite-missions/terra)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Terra: \"Dry mass 4864 kg\" (https://space.oscar.wmo.int/satellites/view/terra)"
        power:
          kind: nominal
          source: "WMO OSCAR/Space, Terra: \"Power 2530 W\" (https://space.oscar.wmo.int/satellites/view/terra)"
        design_life:
          kind: nominal
          source: "eoPortal, Terra: \"The design life of the Terra spacecraft is six years.\" (https://www.eoportal.org/satellite-missions/terra)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, Terra: \"The science data recorded onboard are transmitted via Ku-band at 150 Mbit/s.\" (https://www.eoportal.org/satellite-missions/terra); through TDRS"
  - id: aqua
    name: Aqua
    norad_id: 27424
    status: extended
    as_of: 2026-11-05
    resources: &resources_aqua
      launch_mass: 2934
      dry_mass: 2832
      power: 4860
      design_life: 6
      provenance:
        launch_mass:
          kind: nominal
          source: "NASA Science, Aqua: \"Weight (at launch): 2,934 kg\" (https://science.nasa.gov/mission/aqua/about-aqua-spacecraft-and-instruments)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Aqua: \"Dry mass 2832 kg\" (https://space.oscar.wmo.int/satellites/view/aqua)"
        power:
          kind: nominal
          source: "NASA Science, Aqua: \"Power: 4,860 watts end of life\" (https://science.nasa.gov/mission/aqua/about-aqua-spacecraft-and-instruments)"
        design_life:
          kind: nominal
          source: "NASA Science, Aqua: \"Mission design life: 6 years\" (https://science.nasa.gov/mission/aqua/about-aqua-spacecraft-and-instruments)"
  - id: aura
    name: Aura
    norad_id: 28376
    status: extended
    as_of: 2026-11-15
    resources: &resources_aura
      launch_mass: 2967
      power: 4600
      design_life: 6
      storage: 100000000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, Aura: \"with a total mass of 2,967 kg at launch\" (https://www.eoportal.org/satellite-missions/aura)"
        power:
          kind: nominal
          source: "NASA Science, Aura: \"provides 4600 watts of power in sunlight\" (https://science.nasa.gov/mission/aura/spacecraft-and-instruments)"
        design_life:
          kind: nominal
          source: "eoPortal, Aura: \"The S/C design life is six years.\" (https://www.eoportal.org/satellite-missions/aura)"
        storage:
          kind: nominal
          source: "eoPortal, Aura: \"Onboard storage capacity of 100 Gbit of payload data.\" (https://www.eoportal.org/satellite-missions/aura)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      terra: {type: sso, mean_altitude: 696530, equator_crossing_time: "20:37:38", inclination: 97.9333, reference_time: "2026-10-06T07:11:41Z"}
      aqua: {type: sso, mean_altitude: 692990, equator_crossing_time: "15:48:21", inclination: 98.4481, reference_time: "2026-11-07T06:55:39Z"}
      aura: {type: sso, mean_altitude: 695770, equator_crossing_time: "14:42:07", inclination: 98.3460, reference_time: "2026-08-14T14:18:14Z"}
    provenance:
      terra:
        mean_altitude: &terra
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [terra]
          period: "2026-10-06"
        equator_crossing_time: *terra
        inclination: *terra
        reference_time: *terra
      aqua:
        mean_altitude: &aqua
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [aqua]
          period: "2026-11-07"
        equator_crossing_time: *aqua
        inclination: *aqua
        reference_time: *aqua
      aura:
        mean_altitude: &aura
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [aura]
          period: "2026-08-14"
        equator_crossing_time: *aura
        inclination: *aura
        reference_time: *aura
    limitations:
      - The satellites' phases in their planes are arbitrary (spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The satellites' local times are no longer maintained, so each orbit has its own inclination, at whose rate (the J2 precession of its node) its local time drifts from the cataloged one at its reference time (the epoch of the element set to which it was fitted) to the epoch and during an analysis. The drift of the inclination itself, and any maneuver, are not modeled, so the local time departs from the actual one the further the epoch is from the reference time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
