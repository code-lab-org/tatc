id: icesat_2
name: Ice, Cloud, and land Elevation Satellite-2
aliases: [ICESat-2]
system_class: inclined
selection: NASA's laser altimetry mission, on a 91-day repeat ground track.
operator: NASA
spacecraft:
  - id: icesat-2
    name: ICESat-2
    norad_id: 43613
    status: operational
    as_of: 2026-10-01
    resources: &resources_icesat_2
      launch_mass: 1390
      dry_mass: 1230
      power: 1320
      design_life: 3
      storage: 704000000000
      downlink_rate: 220000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, ICESat-2: \"Mass at launch 1390 kg\" (https://space.oscar.wmo.int/satellites/view/icesat_2)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, ICESat-2: \"Dry mass 1230 kg\" (https://space.oscar.wmo.int/satellites/view/icesat_2)"
        power:
          kind: nominal
          source: "eoPortal, ICESat-2: \"4 solar panels which produce an average of 1320 Watts\" (https://www.eoportal.org/satellite-missions/icesat-2)"
        design_life:
          kind: nominal
          source: "eoPortal, ICESat-2: \"Mission design life 3 years with a 5 year goal\" (https://www.eoportal.org/satellite-missions/icesat-2)"
        storage:
          kind: nominal
          source: "eoPortal, ICESat-2: \"Onboard data storage capacity 704 Gbit at EOL\" (https://www.eoportal.org/satellite-missions/icesat-2)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, ICESat-2: \"Data downlink X-band, data rate of 220 Mbit/s\" (https://www.eoportal.org/satellite-missions/icesat-2)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      icesat-2: {type: circular, mean_altitude: 488030, inclination: 91.9994}
    provenance:
      icesat-2:
        mean_altitude: &icesat_2
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [icesat-2]
          period: "2026-10-04"
        inclination: *icesat_2
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (each spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
