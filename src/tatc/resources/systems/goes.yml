id: goes
name: GOES-R Series
aliases: [GOES, Geostationary Operational Environmental Satellites]
system_class: geostationary
selection: The United States' geostationary weather satellites at the East and West positions.
operator: NOAA and NASA
spacecraft:
  - id: goes-19
    name: GOES-19
    norad_id: 60133
    status: operational
    as_of: 2026-10-03
    resources: &resources_goes_r
      launch_mass: 5500
      dry_mass: 2800
      power: 4000
      design_life: 15
      downlink_rate: 120000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, GOES-18: \"Mass at launch 5500 kg\" (https://space.oscar.wmo.int/satellites/view/goes_18); the same for GOES-19"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, GOES-18: \"Dry mass 2800 kg\" (https://space.oscar.wmo.int/satellites/view/goes_18); the same for GOES-19"
        power:
          kind: nominal
          source: "WMO OSCAR/Space, GOES-18: \"Power 4000 W\" (https://space.oscar.wmo.int/satellites/view/goes_18); the same for GOES-19"
        design_life:
          kind: nominal
          source: "eoPortal, GOES-R: \"Spacecraft design life 15 years (10 operational, after 5 years on-orbit spare)\" (https://www.eoportal.org/satellite-missions/goes-r)"
        downlink_rate:
          kind: nominal
          source: "WMO OSCAR/Space, GOES-18: \"Raw Data Link ... 120000 kbps Raw data\" (https://space.oscar.wmo.int/satellites/view/goes_18); the same for GOES-19"
    communications:
      transmitters:
        - name: X-band raw data link
          band: X
          frequency: 8220000000.0
          max_data_rate: 120000000.0
          provenance:
            band:
              kind: nominal
              source: "WMO OSCAR/Space, GOES-19: \"Raw Data Link | S-E | 8220 MHz | 120000 kHz | linear | D | 120000 kbps | Raw data\" (https://space.oscar.wmo.int/satellites/view/goes_19)"
            max_data_rate:
              kind: nominal
              source: "WMO OSCAR/Space, GOES-19: \"Raw Data Link | S-E | 8220 MHz | 120000 kHz | linear | D | 120000 kbps | Raw data\" (https://space.oscar.wmo.int/satellites/view/goes_19)"
            frequency:
              kind: nominal
              source: "WMO OSCAR/Space, GOES-19: \"Raw Data Link | S-E | 8220 MHz | 120000 kHz | linear | D | 120000 kbps | Raw data\" (https://space.oscar.wmo.int/satellites/view/goes_19)"
  - id: goes-18
    name: GOES-18
    norad_id: 51850
    status: operational
    as_of: 2026-11-17
    resources: *resources_goes_r
default_configuration: slot
configurations:
  slot:
    grade: ground_track
    description: The longitude of each satellite's subpoint, maintained by station-keeping, from its element set.
    orbits:
      goes-19: {type: geosynchronous, longitude: -75.194, inclination: 0.03}
      goes-18: {type: geosynchronous, longitude: -137.031, inclination: 0.01}
    provenance:
      goes-19:
        longitude: &goes_19
          kind: measured
          source: validate_system_orbits.py --fit, the mean over the day after the element set nearest the middle of the day
          platforms: [goes-19]
          period: "2026-10-04"
        inclination: *goes_19
      goes-18:
        longitude: &goes_18
          kind: measured
          source: validate_system_orbits.py --fit, the mean over the day after the element set nearest the middle of the day
          platforms: [goes-18]
          period: "2026-11-18"
        inclination: *goes_18
    limitations:
      - The satellites are kept at their mean longitudes and inclinations, without the daily motion of the subpoint within the station-keeping box.
