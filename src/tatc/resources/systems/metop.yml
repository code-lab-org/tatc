id: metop
name: Metop
aliases: [EUMETSAT Polar System, EPS]
system_class: sun_synchronous
selection: Europe's polar-orbiting weather satellites in the mid-morning orbit, complementing JPSS.
operator: EUMETSAT
spacecraft:
  - id: metop-b
    name: Metop-B
    norad_id: 38771
    status: extended
    as_of: 2026-11-17
    resources: &resources_metop_b
      launch_mass: 4087
      dry_mass: 3771
      power: 3890
      design_life: 5
      storage: 24000000000
      downlink_rate: 70000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Metop-B: \"Mass at launch 4087 kg\" (https://space.oscar.wmo.int/satellites/view/metop_b)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Metop-B: \"Dry mass 3771 kg\" (https://space.oscar.wmo.int/satellites/view/metop_b)"
        power:
          kind: nominal
          source: "eoPortal, MetOp: \"Single sided solar arrays provide a power of 3.890 kW (EOL)\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        design_life:
          kind: nominal
          source: "eoPortal, MetOp: \"The mission design life is 5 years.\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        storage:
          kind: nominal
          source: "eoPortal, MetOp: \"Onboard storage capacity of 24 Gbit\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        downlink_rate:
          kind: nominal
          source: "eoPortal, MetOp: \"Instrument data is downlinked in X-band at a rate of 70 Mbit/s.\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
  - id: metop-c
    name: Metop-C
    norad_id: 43689
    status: operational
    as_of: 2026-11-17
    resources: &resources_metop_c
      launch_mass: 3950
      dry_mass: 3650
      power: 3890
      design_life: 5
      storage: 24000000000
      downlink_rate: 70000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Metop-C: \"Mass at launch 3950 kg\" (https://space.oscar.wmo.int/satellites/view/metop_c)"
        dry_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Metop-C: \"Dry mass 3650 kg\" (https://space.oscar.wmo.int/satellites/view/metop_c)"
        power:
          kind: nominal
          source: "eoPortal, MetOp: \"Single sided solar arrays provide a power of 3.890 kW (EOL)\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        design_life:
          kind: nominal
          source: "eoPortal, MetOp: \"The mission design life is 5 years.\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        storage:
          kind: nominal
          source: "eoPortal, MetOp: \"Onboard storage capacity of 24 Gbit\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
        downlink_rate:
          kind: nominal
          source: "eoPortal, MetOp: \"Instrument data is downlinked in X-band at a rate of 70 Mbit/s.\" (https://www.eoportal.org/satellite-missions/metop); of the MetOp series"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      metop-b: {type: sso, mean_altitude: 827670, equator_crossing_time: "20:57:44"}
      metop-c: {type: sso, mean_altitude: 827410, equator_crossing_time: "21:29:55"}
    provenance:
      metop-b:
        mean_altitude: &metop_b
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [metop-b]
          period: "2026-05-12"
        equator_crossing_time: *metop_b
      metop-c:
        mean_altitude: &metop_c
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [metop-c]
          period: "2026-05-12"
        equator_crossing_time: *metop_c
    limitations:
      - The satellites' phases in their planes are arbitrary (spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
