id: swot
name: Surface Water and Ocean Topography
aliases: [SWOT]
system_class: inclined
selection: The wide-swath altimetry mission of surface water and ocean topography.
operator: NASA and CNES
spacecraft:
  - id: swot
    name: SWOT
    norad_id: 54754
    status: operational
    as_of: 2026-11-04
    resources: &resources_swot
      launch_mass: 2200
      power: 2000
      design_life: 3
      storage: 2300000000000
      downlink_rate: 800000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, SWOT: \"Mass at launch 2200 kg\" (https://space.oscar.wmo.int/satellites/view/swot); eoPortal gives about 2000 kg"
        power:
          kind: nominal
          source: "eoPortal, SWOT: \"Spacecraft power 2 kW total power demand\" (https://www.eoportal.org/satellite-missions/swot)"
        design_life:
          kind: nominal
          source: "eoPortal, SWOT: \"Mission life 3 years (5 years goal)\" (https://www.eoportal.org/satellite-missions/swot)"
        storage:
          kind: nominal
          source: "eoPortal, SWOT: \"a SSR (Solid State Recorder) of 2.3 Tbit capacity\" (https://www.eoportal.org/satellite-missions/swot)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, SWOT: \"an X-band downlink of 800 Mbit/s\" (https://www.eoportal.org/satellite-missions/swot)"
    communications:
      transmitters:
        - name: X-band science data
          band: X
          max_data_rate: 620000000.0
          provenance:
            band:
              kind: nominal
              source: "eoPortal, SWOT: \"Using an LGA at the 8.025-8.400 GHz band allocated for Earth-exploration satellite service\" (https://www.eoportal.org/satellite-missions/swot)"
            max_data_rate:
              kind: nominal
              source: "eoPortal, SWOT: \"This requires a downlink data rate of 620 Mbit/s to deliver this volume\" (https://www.eoportal.org/satellite-missions/swot); in two channels of 310 Mbit/s (the page's summary also gives 800 Mbit/s)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and inclination, from its element set.
    orbits:
      swot: {type: circular, mean_altitude: 900320, inclination: 77.6084}
    provenance:
      swot:
        mean_altitude: &swot
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [swot]
          period: "2026-10-04"
        inclination: *swot
    limitations:
      - The satellites' phases in their planes and the right ascensions of their ascending nodes are arbitrary (each spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
