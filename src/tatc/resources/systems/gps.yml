    limitations:
      - The constellation's node and phase are arbitrary (its first satellite's are zero at the epoch), but each satellite keeps its node and phase relative to the first satellite's on the day of the element sets; satellites at slightly different altitudes drift apart in phase during an analysis, as they do between the operator's maneuvers.
      - The orbits are circular, at TAT-C's mean altitudes (from the mean motion, above the mean radius); the satellites' small eccentricities are not represented.
limitations:
  - The satellites carry no instrument of the instrument catalog, as they transmit the signals that radio occultation receivers sound (see tatc.analysis.collect_ro_observations), and are built with TAT-C's default instrument.
  - The spacecraft are those of CelesTrak's group on the date of their status, which follows its membership, not the health of their signals that the operator announces.
