id: landsat
name: Landsat
system_class: sun_synchronous
selection: The longest record of moderate-resolution land imaging, from satellites maintained on the Worldwide Reference System.
operator: USGS and NASA
spacecraft:
  - id: landsat-8
    name: Landsat 8
    norad_id: 39084
    status: operational
    as_of: 2026-11-03
    resources: &resources_landsat_8
      launch_mass: 2780
      dry_mass: 1512
      power: 4300
      design_life: 5
      storage: 3100000000000
      downlink_rate: 384000000
      provenance:
        launch_mass:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"Launch mass of 2780 kg; dry mass of 1512 kg\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm); OSCAR gives 2623 kg"
        dry_mass:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"Launch mass of 2780 kg; dry mass of 1512 kg\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm)"
        power:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"Power: 4.3 kW @ EOL (End of Life)\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm)"
        design_life:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"The mission design life is 5 years\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm)"
        storage:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"a storage capacity of 4 Tbit @ BOL and 3.1 Tbit @ EOL\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm); at end of life"
        downlink_rate:
          kind: nominal
          source: "eoPortal, Landsat-8/LDCM: \"to maintain a 384 Mbit/s downlink\" (https://www.eoportal.org/satellite-missions/landsat-8-ldcm)"
  - id: landsat-9
    name: Landsat 9
    norad_id: 49260
    status: operational
    as_of: 2026-11-05
    resources: &resources_landsat_9
      launch_mass: 2710
      power: 4300
      design_life: 5
      provenance:
        launch_mass:
          kind: nominal
          source: "NASA, Landsat 9 Fast Facts: \"Mass: 5,975 pounds (2,710 kilograms)\" (https://www.nasa.gov/wp-content/uploads/2015/04/landsat_9_fast_facts.pdf)"
        power:
          kind: nominal
          source: "WMO OSCAR/Space, Landsat-9: \"Power 4300 W\" (https://space.oscar.wmo.int/satellites/view/landsat_9)"
        design_life:
          kind: nominal
          source: "NASA, Landsat 9 Fast Facts: \"Mission Design Life: 5 years\" (https://www.nasa.gov/wp-content/uploads/2015/04/landsat_9_fast_facts.pdf)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      landsat-8: {type: sso, mean_altitude: 709660, equator_crossing_time: "22:12:20", phase: 0}
      landsat-9: {type: sso, mean_altitude: 709660, equator_crossing_time: "22:12:24", phase: 180}
    provenance:
      landsat-8:
        mean_altitude: &landsat_8
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [landsat-8]
          period: "2026-10-04"
        equator_crossing_time: *landsat_8
        phase: &landsat_phasing
          kind: nominal
          source: USGS's phasing of Landsat 9, 8 days (half the 16-day repeat cycle) from Landsat 8, 180 deg apart in their plane, consistent with their element sets of 2026-11-21 (180.2 deg)
      landsat-9:
        mean_altitude: &landsat_9
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [landsat-9]
          period: "2026-10-04"
        equator_crossing_time: *landsat_9
        phase: *landsat_phasing
    limitations:
      - The satellites keep the operator's relative phases (and planes), but the constellation's phase in its plane is arbitrary (relative phases are counted from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
