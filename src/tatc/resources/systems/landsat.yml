id: landsat
name: Landsat
system_class: sun_synchronous
selection: The longest record of moderate-resolution land imaging, from satellites maintained on the Worldwide Reference System.
operator: USGS and NASA
spacecraft:
  - id: landsat-8
    name: Landsat 8
    norad_id: 39084
    status: operational
    as_of: 2026-11-03
  - id: landsat-9
    name: Landsat 9
    norad_id: 49260
    status: operational
    as_of: 2026-11-05
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      landsat-8: {type: sso, mean_altitude: 709660, equator_crossing_time: "22:12:20"}
      landsat-9: {type: sso, mean_altitude: 709660, equator_crossing_time: "22:12:24"}
    provenance:
      landsat-8:
        mean_altitude: &landsat_8
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [landsat-8]
          period: "2026-10-02"
        equator_crossing_time: *landsat_8
      landsat-9:
        mean_altitude: &landsat_9
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [landsat-9]
          period: "2026-10-02"
        equator_crossing_time: *landsat_9
    limitations:
      - The satellites' phases in their planes are arbitrary (zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
