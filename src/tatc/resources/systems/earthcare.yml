id: earthcare
name: EarthCARE
aliases: [Earth Cloud, Aerosol and Radiation Explorer]
system_class: sun_synchronous
selection: Europe and Japan's cloud, aerosol, and radiation explorer.
operator: ESA and JAXA
spacecraft:
  - id: earthcare
    name: EarthCARE
    norad_id: 59908
    status: operational
    as_of: 2026-11-07
    resources: &resources_earthcare
      launch_mass: 2200
      power: 1700
      design_life: 3
      downlink_rate: 150000000
      provenance:
        launch_mass:
          kind: nominal
          source: "ESA, EarthCARE facts and figures: \"Mass 2200 kg (including a maximum of 310 kg fuel)\" (https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/Facts_and_figures)"
        power:
          kind: nominal
          source: "ESA, EarthCARE facts and figures: \"Power 1.7 kW (end-of-life orbit average)\" (https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/Facts_and_figures)"
        design_life:
          kind: nominal
          source: "ESA, EarthCARE facts and figures: \"Life Minimum of three years\" (https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/Facts_and_figures)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, EarthCARE: \"Payload data will be transferred at a rate of up to 150 Mbit/s via X-band\" (https://www.eoportal.org/satellite-missions/earthcare)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      earthcare: {type: sso, mean_altitude: 403200, equator_crossing_time: "01:58:12"}
    provenance:
      earthcare:
        mean_altitude: &earthcare
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [earthcare]
          period: "2026-09-27"
        equator_crossing_time: *earthcare
    limitations:
      - The satellites' phases in their planes are arbitrary (spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
  ground_track:
    grade: ground_track
    description: The satellite's orbit maintained on EarthCARE's repeat ground track of 389 orbits in 25 days, pinned to an ascending node fitted to its element sets.
    orbits:
      earthcare: {type: repeat, revolutions: 389, days: 25, ascending_node: {time: "2026-09-27T02:40:06.088Z", longitude: -10.4794}}
    provenance:
      earthcare:
        revolutions: &earthcare_repeat
          kind: nominal
          source: EarthCARE's repeat ground track of 389 orbits in 25 days (ESA and JAXA)
        days: *earthcare_repeat
        ascending_node:
          kind: measured
          source: validate_system_orbits.py --fit, the middle of the nodes of the element sets (fit_ascending_node)
          platforms: [earthcare]
          period: "2026-09-27 to 2026-09-28"
    limitations:
      - Passes follow the maintained ground track to within the band in which it is maintained, and their times drift with the local time of the ascending node within its maintenance; analyses that need passes to seconds should build orbits from current element sets (by each spacecraft's NORAD catalog number).
      - Each ascending node is fitted to the element sets of one or two days (as registered for validation), not to weeks of element sets, so it is the position of the ground track within its band on those days.
      - The repeat cycle is of days of Terrestrial Time, so pass times slip from the Earth's rotation by the change of the difference between Terrestrial Time and Universal Time (a few tenths of a second a year).
