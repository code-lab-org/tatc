id: metop_sg
name: Metop Second Generation
aliases: [Metop-SG, EPS-SG]
system_class: sun_synchronous
selection: The successors of Metop in the mid-morning orbit, whose A satellites carry sounders and imagers.
operator: EUMETSAT
spacecraft:
  - id: metop-sga1
    name: Metop-SG A1
    norad_id: 65159
    status: operational
    as_of: 2026-11-17
    resources: &resources_metop_sga1
      launch_mass: 4400
      power: 3290
      storage: 745000000000
      downlink_rate: 781000000
      provenance:
        launch_mass:
          kind: nominal
          source: "WMO OSCAR/Space, Metop-SG-A1: \"Mass at launch 4400 kg\" (https://space.oscar.wmo.int/satellites/view/metop_sg_a1)"
        power:
          kind: nominal
          source: "eoPortal, MetOp-SG: \"Power consumption 3.29 kW 2.40 kW\" (https://www.eoportal.org/satellite-missions/metop-sg); the consumption of satellite A (Table 2)"
        storage:
          kind: nominal
          source: "eoPortal, MetOp-SG: \"Data storage 745 Gbit (sized for 1.5 orbits of Satellite A)\" (https://www.eoportal.org/satellite-missions/metop-sg)"
        downlink_rate:
          kind: nominal
          source: "eoPortal, MetOp-SG: \"Ka-band downlink (Mbit/s) 781 (2 channels)\" (https://www.eoportal.org/satellite-missions/metop-sg)"
default_configuration: plane
configurations:
  plane:
    grade: plane
    description: The plane of each satellite's orbit, by its mean altitude and the local time of its ascending node, from its element set.
    orbits:
      metop-sga1: {type: sso, mean_altitude: 827510, equator_crossing_time: "21:28:45"}
    provenance:
      metop-sga1:
        mean_altitude: &metop_sga1
          kind: measured
          source: validate_system_orbits.py --fit, from the element set nearest the middle of the day
          platforms: [metop-sga1]
          period: "2026-10-13"
        equator_crossing_time: *metop_sga1
    limitations:
      - The satellites' phases in their planes are arbitrary (spaced evenly among the satellites built, from zero at the epoch), so the orbits represent the statistics of revisits and coverage, not the times or tracks of passes.
      - The inclination is the sun-synchronous one of the altitude, not the one operators maintain to steer the local time.
      - Altitudes are TAT-C's mean altitudes (from the mean motion, above the mean radius), not the operators' nominal altitudes.
